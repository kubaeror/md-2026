l_polish:

 ### BOOKMARK ###
 MD_2026:0 "Millennium Dawn 2026"
 MD_2026_DESC:0 "Świat stoi na rozdrożu. Wojna Rosji w Ukrainie ciągnie się już czwarty rok, przekształcając bezpieczeństwo Europy. Wzrost potęgi Chin podważa amerykańską hegemonię na Pacyfiku. Bliski Wschód wciąż pozostaje w stanie niepewności po upadku Assada i konflikcie w Strefie Gazy. NATO rozszerzyło się do 32 członków, BRICS+ dąży do przebudowy globalnego porządku, a populizm zyskuje na sile w państwach demokratycznych. Stary porządek światowy umiera, a nowy z trudem się rodzi."

 ### BOOKMARK COUNTRY DESCRIPTIONS ###
 USA_MD2026_DESC:0 "Prezydent Donald Trump wrócił do Białego Domu na drugą kadencję, obiecując zakończenie wojny w Ukrainie, wprowadzenie daleko idących ceł i realizację polityki „America First”. Stany Zjednoczone zmagają się z głęboką polaryzacją polityczną, zachowując jednocześnie pozycję najważniejszej militarnej i gospodarczej potęgi świata."
 SOV_MD2026_DESC:0 "Wojna Rosji w Ukrainie trwa i nie widać jej końca. Prezydent Putin skonsolidował władzę, lecz zmaga się z rosnącą presją gospodarczą wywołaną zachodnimi sankcjami. Rosja zwraca się ku Chinom i BRICS+, utrzymując arsenał nuklearny jako ostatecznego gwaranta przetrwania reżimu."
 CHI_MD2026_DESC:0 "Pod nieprzerwanym przywództwem Xi Jinpinga Chiny dążą do „wielkiego odrodzenia narodu chińskiego”. Wzrost gospodarczy wyhamował, lecz modernizacja wojskowa przyspiesza. Kwestia Tajwanu nabiera ogromnego znaczenia, gdy Chiny budują największą marynarkę wojenną świata i rozszerzają swoje wpływy globalne poprzez Nowy Jedwabny Szlak."
 UKR_MD2026_DESC:0 "Ukraina walczy o przetrwanie z rosyjską agresją. Prezydent Zełenski przewodzi narodowi, który utracił terytorium, ale zyskał bezprecedensowe wsparcie Zachodu. Pozostaje pytanie: czy wojna zakończy się zwycięstwem militarnym, zamrożonym konfliktem, czy wynegocjowanym porozumieniem, które może wymagać bolesnych ustępstw?"
 ISR_MD2026_DESC:0 "Izrael funkcjonuje w trybie wojennym po atakach z października 2023 r. i późniejszych operacjach wojskowych. Porozumienia Abrahamowe oferują normalizację stosunków dyplomatycznych z państwami arabskimi, lecz kwestia palestyńska pozostaje nierozwiązana. Irański program nuklearny stanowi zagrożenie egzystencjalne."
 TUR_MD2026_DESC:0 "Prezydent Erdogan skonsolidował władzę w Turcji, balansując między członkostwem w NATO a bliższymi stosunkami z Rosją i Chinami. Turcja kontroluje kluczowe cieśniny, gości miliony uchodźców i odgrywa kluczową rolę w geopolityce Bliskiego Wschodu i Azji Centralnej."
 POL_MD2026_DESC:0 "Polska wyrosła na wschodnią tarczę NATO, drastycznie zwiększając wydatki na obronę, by stać się najsilniejszą siłą konwencjonalną Europy. Granicząc z Ukrainą i rosyjską enklawą Kaliningrad, Polska stoi na pierwszej linii europejskiego bezpieczeństwa."
 JAP_MD2026_DESC:0 "Japonia mierzy się z rosnącymi wyzwaniami bezpieczeństwa ze strony chińskich zbrojeń, północnokoreańskiego programu nuklearnego i rosyjskiej agresji. Pod rządami premiera Ishiby Japonia kontynuuje historyczny zwrot ku bardziej stanowczej postawie obronnej, zmagając się jednocześnie z wyzwaniami gospodarczymi."
 GER_MD2026_DESC:0 "Niemcy przechodzą swoją Zeitenwende – punkt zwrotny w polityce obronnej i energetycznej. Kanclerz Merz stoi na czele największej gospodarki Europy, która mierzy się z zależnością energetyczną od Rosji, niedoinwestowaniem wojska i wyzwaniem przewodzenia UE."
 FRA_MD2026_DESC:0 "Francja pod rządami prezydenta Macrona utrzymuje odstraszanie nuklearne i miejsce w Radzie Bezpieczeństwa ONZ, dążąc jednocześnie do europejskiej autonomii strategicznej. Wewnętrzne rozdrobnienie polityczne i napięcia społeczne komplikują ambitną politykę zagraniczną Francji."
 ENG_MD2026_DESC:0 "Wielka Brytania pod rządami premiera Starmera porusza się w rzeczywistości po brexicie, utrzymując specjalne stosunki ze Stanami Zjednoczonymi i zaangażowanie w NATO. Brytania pozostaje mocarstwem nuklearnym o globalnym zasięgu militarnym."
 ITA_MD2026_DESC:0 "Włochy zmagają się z presją migracyjną z basenu Morza Śródziemnego, stagnacją gospodarczą oraz swoją rolą w NATO i UE. Kluczowe mocarstwo Europy Południowej o strategicznym położeniu w regionie Morza Śródziemnego."
 RAJ_MD2026_DESC:0 "Indie pod rządami premiera Modiego balansują między zbliżeniem z Zachodem a członkostwem w BRICS+, dążąc do autonomii strategicznej. Najludniejszy kraj świata szybko się modernizuje, zarządzając jednocześnie napięciami granicznymi z Chinami i Pakistanem."
 BRA_MD2026_DESC:0 "Brazylia pod rządami prezydenta Luli wraca do aktywnej dyplomacji wielostronnej jako członek założyciel BRICS+. Największa gospodarka Ameryki Łacińskiej chce wykorzystać swoje bogactwo rolne i surowcowe, mierząc się jednocześnie z nierównościami społecznymi."
 PER_MD2026_DESC:0 "Iran pod rządami najwyższego przywódcy Chameneiego mierzy się z międzynarodowymi sankcjami i presją wewnętrzną. Jego program nuklearny zbliża się do zdolności przełamania progu, a regionalna sieć pełnomocników została osłabiona. Przetrwanie reżimu zależy od balansowania między konfrontacją a kompromisem."
 KOR_MD2026_DESC:0 "Korea Południowa mierzy się z podwójnym zagrożeniem: arsenałem nuklearnym Korei Północnej i rosnącą asertywnością Chin w regionie. Technologiczne mocarstwo i kluczowy sojusznik USA w Indo-Pacyfiku."
 NKO_MD2026_DESC:0 "Korea Północna pod rządami Kim Dzong Una osiągnęła de facto status państwa nuklearnego. Całkowicie odizolowany, lecz uzbrojony w międzykontynentalne pociski balistyczne reżim utrzymuje władzę dzięki represjom, wysyłając jednocześnie wojska do Ukrainy u boku Rosji."
 SAU_MD2026_DESC:0 "Arabia Saudyjska pod rządami księcia koronnego MBS realizuje transformację gospodarczą „Wizja 2030”, lawirując między regionalną rywalizacją z Iranem a złożonymi relacjami zarówno z USA, jak i Chinami."
 SYR_MD2026_DESC:0 "Syria wchodzi w nową erę po upadku reżimu Assada. Kraj stoi przed monumentalnym zadaniem odbudowy, a różne frakcje rywalizują o wpływy w powojennym porządku."
 CAN_MD2026_DESC:0 "Kanada podtrzymuje zaangażowanie w NATO i zachodnie sojusze, mierząc się jednocześnie z wyzwaniami dla suwerenności w Arktyce ze strony Rosji oraz presją gospodarczą ze strony amerykańskiej polityki handlowej."
 SWE_MD2026_DESC:0 "Szwecja wstąpiła do NATO, kończąc dziesięciolecia neutralności w odpowiedzi na rosyjską agresję w Ukrainie. Silna gospodarka i zaawansowany przemysł obronny wzmacniają północną flankę sojuszu."
 FIN_MD2026_DESC:0 "Finlandia wstąpiła do NATO w 2023 r., dodając do sojuszu 1340 km granicy z Rosją. Jedna z najzdolniejszych armii Europy z dużym doświadczeniem w działaniach wojennych w Arktyce."
 NRY_MD2026_DESC:0 "Norwegia strzeże arktycznej flanki NATO, czerpiąc korzyści z wysokich cen energii jako kluczowy dostawca gazu ziemnego dla Europy po odcięciu dostaw rosyjskiej energii."
 HUN_MD2026_DESC:0 "Węgry pod rządami premiera Orbána prowadzą niezależną politykę zagraniczną w ramach NATO i UE, utrzymując bliższe stosunki z Rosją i Chinami, niż odpowiadałoby to ich sojusznikom."
 ROM_MD2026_DESC:0 "Rumunia leży na strategicznym skrzyżowaniu wschodniej i południowej flanki NATO, goszcząc siły sojusznicze i monitorując Morze Czarne w miarę trwania wojny w Ukrainie."
 AST_MD2026_DESC:0 "Australia zacieśnia więzi bezpieczeństwa z USA w ramach AUKUS, zarządzając jednocześnie złożonymi relacjami gospodarczymi z Chinami, swoim największym partnerem handlowym."
 SUD_MD2026_DESC:0 "Sudan pogrążony jest w wyniszczającej wojnie domowej między armią a Siłami Szybkiego Wsparcia, co tworzy jeden z najgorszych kryzysów humanitarnych na świecie."
 BRM_MD2026_DESC:0 "Birma pozostaje pod rządami junty wojskowej po zamachu stanu z 2021 r., mierząc się z powszechnym oporem i załamaniem gospodarczym."
 IND_MD2026_DESC:0 "Indonezja pod rządami prezydenta Prabowo Subianto prowadzi stanowczą politykę zagraniczną i szybko się zbroi: nowe francuskie Rafale, tureckie i koreańskie projekty oraz rosnąca rola w BRICS i Globalnym Południu. Archipelag balansuje między Waszyngtonem a Pekinem, zarządzając jednocześnie Morzem Południowochińskim i kryzysem w Birmie."
 VEN_MD2026_DESC:0 "Wenezuela pod rządami prezydenta Nicolása Maduro znajduje się pod narastającą presją USA. Karaibskie uderzenia z lat 2025–2026 i amerykańska kampania przeciwko reżimowi uczyniły z tego kraju najbardziej niebezpieczny punkt zapalny na półkuli zachodniej, podczas gdy gospodarka i uzbrojone przez Rosję siły zbrojne podupadają."
 OTHER_MD2026_DESC:0 "Państwo przedzierające się przez burzliwą geopolitykę 2026 roku."

 ### NATIONAL SPIRITS ###
 md2026_sov_western_sanctions:0 "Zachodnie sankcje"
 md2026_sov_western_sanctions_desc:0 "Wszechstronne zachodnie sankcje uderzają w rosyjski system finansowy, eksport energii i import technologii. Gospodarka dostosowała się do nich, lecz długoterminowy wzrost jest poważnie ograniczony."
 md2026_sov_war_mobilization:0 "Mobilizacja wojenna"
 md2026_sov_war_mobilization_desc:0 "Rosja przestawiła się na gospodarkę wojenną, w której produkcja wojskowa ma pierwszeństwo przed potrzebami cywilnymi. Wprowadzono częściową mobilizację, aby utrzymać siły na froncie."
 md2026_ukr_western_military_aid:0 "Zachodnia pomoc wojskowa"
 md2026_ukr_western_military_aid_desc:0 "Ukraina otrzymuje znaczną pomoc wojskową od sojuszników z NATO, w tym zaawansowane systemy uzbrojenia, szkolenia i wsparcie wywiadowcze."
 md2026_ukr_western_aid_tt:0 "Otrzymywanie zachodniego sprzętu wojskowego i szkolenia"
 md2026_ukr_defensive_mobilization:0 "Mobilizacja obronna"
 md2026_ukr_defensive_mobilization_desc:0 "Cały naród ukraiński jest zmobilizowany do obrony. Rozszerzono pobór, a społeczeństwo obywatelskie aktywnie wspiera wysiłek wojenny."
 md2026_usa_political_polarization:0 "Polaryzacja polityczna"
 md2026_usa_political_polarization_desc:0 "Społeczeństwo amerykańskie jest głęboko podzielone na tle politycznym. Paraliż Kongresu, polaryzacja mediów i napięcia społeczne podkopują rządzenie i jedność narodową."
 md2026_usa_america_first:0 "Ameryka przede wszystkim"
 md2026_usa_america_first_desc:0 "Doktryna „America First” administracji Trumpa stawia na pierwszym miejscu interesy krajowe, dwustronne układy i sceptycyzm wobec instytucji wielostronnych oraz sojuszy."
 md2026_chi_economic_slowdown:0 "Spowolnienie gospodarcze"
 md2026_chi_economic_slowdown_desc:0 "Wzrost gospodarczy Chin wyhamował w obliczu kryzysu na rynku nieruchomości, spadku demograficznego i napięć handlowych z Zachodem. Era dwucyfrowego wzrostu dobiegła końca."
 md2026_chi_military_modernization:0 "Modernizacja wojskowa"
 md2026_chi_military_modernization_desc:0 "Armia Ludowo-Wyzwoleńcza przechodzi szybką modernizację, koncentrując się na sile morskiej, technologii rakietowej i przygotowaniach do potencjalnych operacji przeciwko Tajwanowi."
 md2026_ger_zeitenwende:0 "Zeitenwende"
 md2026_ger_zeitenwende_desc:0 "Niemiecki „punkt zwrotny” w polityce obronnej zaowocował zwiększeniem wydatków wojskowych, dywersyfikacją dostaw energii z dala od Rosji i bardziej stanowczą postawą w polityce zagranicznej."
 md2026_eng_post_brexit:0 "Brytania po brexicie"
 md2026_eng_post_brexit_desc:0 "Wielka Brytania wciąż dostosowuje się do życia poza UE. Tarcia handlowe, rozbieżności regulacyjne i pytania o przyszłość unii kształtują krajową politykę."
 md2026_isr_wartime_footing:0 "Tryb wojenny"
 md2026_isr_wartime_footing_desc:0 "Izrael utrzymuje podwyższoną gotowość wojskową po atakach z października 2023 r. i w obliczu trwających zagrożeń bezpieczeństwa regionalnego ze strony Iranu i jego pełnomocników."
 md2026_tur_erdogan_autocracy:0 "Konsolidacja władzy Erdogana"
 md2026_tur_erdogan_autocracy_desc:0 "Prezydent Erdogan skoncentrował władzę dzięki zmianom konstytucyjnym. Wolność prasy i niezależność sądownictwa uległy erozji, lecz Turcja pozostaje strategicznym członkiem NATO."
 md2026_per_international_sanctions:0 "Międzynarodowe sankcje"
 md2026_per_international_sanctions_desc:0 "Iran mierzy się z wszechstronnymi międzynarodowymi sankcjami wymierzonymi w jego program nuklearny, rozwój rakiet i wsparcie dla regionalnych pełnomocników."
 md2026_nko_total_isolation:0 "Całkowita izolacja"
 md2026_nko_total_isolation_desc:0 "Korea Północna jest najbardziej odizolowanym państwem świata, objętym maksymalnymi sankcjami, a jednocześnie utrzymuje arsenał nuklearny i wysyła wojska wspierające Rosję."
 md2026_pol_eastern_shield:0 "Wschodnia tarcza"
 md2026_pol_eastern_shield_desc:0 "Polska rozpoczęła największe dozbrojenie w Europie, dążąc do wystawienia najsilniejszych sił konwencjonalnych na kontynencie w celu odstraszania rosyjskiej agresji."

 ### FOCUS TREES ###

 ## USA Focuses ##
 MD2026_USA_trump_second_term:0 "Druga kadencja Trumpa"
 MD2026_USA_trump_second_term_desc:0 "Donald Trump wrócił do Białego Domu z ogromnym mandatem. Jego agenda „America First” przekształci politykę wewnętrzną i zagraniczną na wiele lat."
 MD2026_USA_mass_deportations:0 "Masowe deportacje"
 MD2026_USA_mass_deportations_desc:0 "Administracja rozpoczyna bezprecedensową kampanię masowych deportacji wymierzoną w miliony nieudokumentowanych imigrantów, obciążając organy ścigania i wywołując niepokoje społeczne."
 MD2026_USA_border_security:0 "Zabezpieczyć granicę"
 MD2026_USA_border_security_desc:0 "Nowe środki bezpieczeństwa granicy, w tym rozbudowa muru i wzmocniony nadzór, mają powstrzymać nielegalne przekraczanie granicy."
 MD2026_USA_radical_tax_cuts:0 "Radykalne obniżki podatków"
 MD2026_USA_radical_tax_cuts_desc:0 "Daleko idące obniżki podatków dla korporacji i najbogatszych mają pobudzić wzrost gospodarczy, choć krytycy ostrzegają przed rosnącym deficytem."
 MD2026_USA_trade_tariffs:0 "Wprowadzić cła"
 MD2026_USA_trade_tariffs_desc:0 "Szerokie cła na importowane towary mają chronić amerykański przemysł, lecz grożą wywołaniem odwetowych działań partnerów handlowych."
 MD2026_USA_trade_war_china:0 "Wojna handlowa z Chinami"
 MD2026_USA_trade_war_china_desc:0 "Zaostrzające się cła i kontrole eksportu wobec Chin obejmują półprzewodniki, metale ziem rzadkich i zaawansowane technologie w ramach pełnoskalowej konfrontacji gospodarczej."
 MD2026_USA_trade_war_eu:0 "Wojna handlowa z UE"
 MD2026_USA_trade_war_eu_desc:0 "Cła rozszerzone na europejskich sojuszników nadwyrężają relacje transatlantyckie i zagrażają spójności NATO."
 MD2026_USA_energy_dominance:0 "Dominacja energetyczna"
 MD2026_USA_energy_dominance_desc:0 "Administracja stawia na maksymalne wydobycie paliw kopalnych, by osiągnąć niezależność energetyczną i wykorzystać eksport jako narzędzie geopolityczne."
 MD2026_USA_drill_baby_drill:0 "Wierć, kochanie, wierć"
 MD2026_USA_drill_baby_drill_desc:0 "Otwarcie ziem federalnych i obszarów morskich na wydobycie drastycznie zwiększa produkcję ropy i gazu, znosząc jednocześnie ochronę środowiska."
 MD2026_USA_lng_exports:0 "Rozbudowa eksportu LNG"
 MD2026_USA_lng_exports_desc:0 "Rozbudowa terminali eksportowych LNG pozwala Ameryce zaopatrywać sojuszników w Europie i Azji, zmniejszając ich zależność od rosyjskiej i bliskowschodniej energii."
 MD2026_USA_nato_pressure:0 "Naciskać na sojuszników z NATO"
 MD2026_USA_nato_pressure_desc:0 "Administracja żąda od sojuszników z NATO wywiązania się ze zobowiązań dotyczących wydatków na obronę, grożąc ograniczeniem amerykańskich gwarancji bezpieczeństwa."
 MD2026_USA_pentagon_budget:0 "Wzrost budżetu Pentagonu"
 MD2026_USA_pentagon_budget_desc:0 "Ogromny wzrost wydatków na obronę finansuje modernizację wszystkich rodzajów sił zbrojnych i rozbudowę zdolności projekcji siły."
 MD2026_USA_space_force_expansion:0 "Rozbudowa Sił Kosmicznych"
 MD2026_USA_space_force_expansion_desc:0 "Siły Kosmiczne otrzymują znaczne środki na orbitalne systemy obronne, konstelacje satelitów i zdolności przeciwkosmiczne."
 MD2026_USA_deal_with_russia:0 "Układ z Rosją"
 MD2026_USA_deal_with_russia_desc:0 "Dążenie do bezpośredniej dyplomacji z Moskwą w celu wynegocjowania rozwiązania konfliktu w Ukrainie, potencjalnie kosztem integralności terytorialnej Ukrainy."
 MD2026_USA_ukraine_peace_deal:0 "Porozumienie pokojowe dla Ukrainy"
 MD2026_USA_ukraine_peace_deal_desc:0 "Wynegocjowane porozumienie między Rosją a Ukrainą ma zakończyć wojnę poprzez kompromis terytorialny i gwarancje bezpieczeństwa."
 MD2026_USA_abandon_ukraine:0 "Porzucić Ukrainę"
 MD2026_USA_abandon_ukraine_desc:0 "USA wycofują pomoc wojskową dla Ukrainy, skutecznie wywierając presję na Kijów, by przyjął rosyjskie warunki. Europejscy sojusznicy gorączkowo próbują wypełnić lukę."

 ## Russia Focuses ##
 MD2026_SOV_war_crossroads:0 "Wojna na rozdrożu"
 MD2026_SOV_war_crossroads_desc:0 "Wojna Rosji w Ukrainie osiągnęła krytyczny punkt. Kreml musi zdecydować, czy eskaluje, zamrozi konflikt, czy zwróci się ku wschodowi w poszukiwaniu nowych sojuszy."
 MD2026_SOV_escalation:0 "Eskalować wojnę"
 MD2026_SOV_escalation_desc:0 "Moskwa decyduje się na eskalację militarną, kierując dodatkowe zasoby i ludzi na front ukraiński wielkim kosztem stabilności i gospodarki."
 MD2026_SOV_total_mobilization:0 "Mobilizacja totalna"
 MD2026_SOV_total_mobilization_desc:0 "Pełna mobilizacja narodowa stawia Rosję w stan wojenny, drastycznie powiększając armię, lecz wywołując poważne obciążenie wewnętrzne."
 MD2026_SOV_nuclear_threats:0 "Nuklearne brzęczenie szablą"
 MD2026_SOV_nuclear_threats_desc:0 "Rosja wystosowuje jednoznaczne groźby nuklearne, by odstraszyć interwencję Zachodu, podnosząc globalne napięcie do najwyższego poziomu od czasów zimnej wojny."
 MD2026_SOV_frozen_conflict:0 "Zamrożony konflikt"
 MD2026_SOV_frozen_conflict_desc:0 "Rosja dąży do zamrożenia konfliktu wzdłuż obecnych linii, konsolidując zdobycze terytorialne i zmniejszając gospodarcze obciążenie aktywnej wojny."
 MD2026_SOV_consolidate_territories:0 "Konsolidacja terytoriów"
 MD2026_SOV_consolidate_territories_desc:0 "Skupienie się na włączeniu okupowanych terytoriów ukraińskich do rosyjskiego systemu administracyjnego i gospodarczego."
 MD2026_SOV_economic_autarky:0 "Autarkia gospodarcza"
 MD2026_SOV_economic_autarky_desc:0 "W obliczu zachodnich sankcji Rosja dąży do samowystarczalności poprzez substytucję importu i rozwój produkcji krajowej."
 MD2026_SOV_import_substitution:0 "Substytucja importu"
 MD2026_SOV_import_substitution_desc:0 "Przyspieszony rozwój krajowego potencjału przemysłowego w celu zastąpienia objętego sankcjami zachodniego importu, zwłaszcza w technologii i przemyśle."
 MD2026_SOV_sanctions_circumvention:0 "Obchodzenie sankcji"
 MD2026_SOV_sanctions_circumvention_desc:0 "Tworzenie równoległych sieci handlowych i spółek słupów w celu obchodzenia zachodnich sankcji za pośrednictwem państw trzecich."
 MD2026_SOV_eastern_pivot:0 "Zwrot ku wschodowi"
 MD2026_SOV_eastern_pivot_desc:0 "Rosja przekierowuje swoje wysiłki gospodarcze i dyplomatyczne ku Chinom, Indiom i Globalnemu Południu w miarę pogarszania się stosunków z Zachodem."
 MD2026_SOV_china_trade:0 "Zacieśnić handel z Chinami"
 MD2026_SOV_china_trade_desc:0 "Rozszerzanie dwustronnego handlu z Chinami w dziedzinie energii, rolnictwa i technologii, by zrekompensować utratę rynków europejskich."
 MD2026_SOV_brics_leadership:0 "Przewodzić BRICS+"
 MD2026_SOV_brics_leadership_desc:0 "Rosja dąży do przekształcenia BRICS+ w realną przeciwwagę dla zachodnich instytucji, promując dedolaryzację i multipolarny porządek światowy."

 ## Ukraine Focuses ##
 MD2026_UKR_war_path:0 "Ścieżka wojenna Ukrainy"
 MD2026_UKR_war_path_desc:0 "Ukraina staje przed najważniejszym wyzwaniem w swojej historii: dalej walczyć o integralność terytorialną czy dążyć do dyplomatycznego rozwiązania i powstrzymania rozlewu krwi."
 MD2026_UKR_counteroffensive:0 "Rozpocząć kontrofensywę"
 MD2026_UKR_counteroffensive_desc:0 "Ukraina przygotowuje wielką kontrofensywę mającą odzyskać okupowane terytoria, co wymaga maksymalnego wsparcia i zaangażowania militarnego Zachodu."
 MD2026_UKR_western_weapons:0 "Zachodnie uzbrojenie"
 MD2026_UKR_western_weapons_desc:0 "Pozyskanie zaawansowanych zachodnich systemów uzbrojenia, w tym rakiet dalekiego zasięgu, nowoczesnych czołgów i samolotów bojowych, by zmienić układ sił na froncie."
 MD2026_UKR_liberate_donbas:0 "Wyzwolić Donbas"
 MD2026_UKR_liberate_donbas_desc:0 "Zdeterminowane natarcie mające wyzwolić okupowany region Donbasu – serce ukraińskiego przemysłu i symbol suwerenności narodowej."
 MD2026_UKR_diplomatic_path:0 "Ścieżka dyplomatyczna"
 MD2026_UKR_diplomatic_path_desc:0 "Ukraina dąży do wynegocjowanego porozumienia, starając się zakończyć wojnę drogą dyplomatyczną przy zachowaniu jak największej suwerenności."
 MD2026_UKR_nato_membership:0 "Członkostwo w NATO"
 MD2026_UKR_nato_membership_desc:0 "Ostateczny cel bezpieczeństwa Ukrainy: pełne członkostwo w NATO z gwarancjami Artykułu 5, wymagające zakończenia aktywnych działań wojennych."
 MD2026_UKR_eu_integration:0 "Integracja z UE"
 MD2026_UKR_eu_integration_desc:0 "Przyspieszenie reform akcesyjnych, by zintegrować gospodarkę i instytucje Ukrainy z Unią Europejską."
 MD2026_UKR_reconstruction:0 "Odbudowa narodowa"
 MD2026_UKR_reconstruction_desc:0 "Zakrojona na ogromną skalę odbudowa zniszczonej wojną infrastruktury, miast i potencjału przemysłowego przy wsparciu międzynarodowej pomocy."
 MD2026_UKR_defense_industry:0 "Przemysł obronny"
 MD2026_UKR_defense_industry_desc:0 "Rozwój krajowego przemysłu obronnego zdolnego produkować drony, pojazdy opancerzone i amunicję, by zmniejszyć zależność od dostaw zagranicznych."

 ## China Focuses ##
 MD2026_CHI_great_rejuvenation:0 "Wielkie odrodzenie"
 MD2026_CHI_great_rejuvenation_desc:0 "Wizja Xi Jinpinga wielkiego odrodzenia narodu chińskiego wchodzi w decydującą fazę, umacniając rolę Chin jako globalnego supermocarstwa."
 MD2026_CHI_taiwan_question:0 "Kwestia Tajwanu"
 MD2026_CHI_taiwan_question_desc:0 "Pekin zwiększa presję na Tajwan, traktując zjednoczenie jako żywotny interes narodowy. Ćwiczenia wojskowe i izolacja dyplomatyczna przybierają na sile."
 MD2026_CHI_taiwan_escalation:0 "Eskalacja wokół Tajwanu"
 MD2026_CHI_taiwan_escalation_desc:0 "Chiny przygotowują się do militarnego rozwiązania kwestii Tajwanu, ryzykując wojnę ze Stanami Zjednoczonymi i ich sojusznikami nad Pacyfikiem."
 MD2026_CHI_taiwan_diplomacy:0 "Dyplomacja wobec Tajwanu"
 MD2026_CHI_taiwan_diplomacy_desc:0 "Chiny prowadzą wobec Tajwanu podejście dyplomatyczne, wykorzystując zachęty gospodarcze i presję polityczną zamiast siły militarnej."
 MD2026_CHI_belt_road_2:0 "Nowy Jedwabny Szlak 2.0"
 MD2026_CHI_belt_road_2_desc:0 "Kolejny etap Inicjatywy Pasa i Szlaku koncentruje się na infrastrukturze cyfrowej, zielonej energii i głębszej integracji gospodarczej Globalnego Południa."
 MD2026_CHI_global_infrastructure:0 "Globalna infrastruktura"
 MD2026_CHI_global_infrastructure_desc:0 "Ogromne inwestycje infrastrukturalne w Afryce, Azji Centralnej i Azji Południowo-Wschodniej rozszerzają chińskie wpływy gospodarcze na całym świecie."
 MD2026_CHI_tech_dominance:0 "Dominacja technologiczna"
 MD2026_CHI_tech_dominance_desc:0 "Chiny dążą do samowystarczalności technologicznej i globalnego przywództwa w dziedzinie AI, informatyki kwantowej i zaawansowanej produkcji."
 MD2026_CHI_semiconductor_war:0 "Wojna o półprzewodniki"
 MD2026_CHI_semiconductor_war_desc:0 "Ogromne inwestycje w krajową produkcję półprzewodników, by zerwać zależność od tajwańskich i zachodnich dostawców układów scalonych."
 MD2026_CHI_space_program:0 "Program kosmiczny"
 MD2026_CHI_space_program_desc:0 "Chiński program kosmiczny rozwija się dzięki stałej stacji kosmicznej, planom bazy księżycowej i wojskowym zdolnościom kosmicznym."
 MD2026_CHI_naval_expansion:0 "Rozbudowa floty"
 MD2026_CHI_naval_expansion_desc:0 "Marynarka Armii Ludowo-Wyzwoleńczej kontynuuje szybką rozbudowę, wcielając nowe lotniskowce, niszczyciele i okręty podwodne, by projektować siłę na całym Pacyfiku."
 MD2026_CHI_south_china_sea:0 "Morze Południowochińskie"
 MD2026_CHI_south_china_sea_desc:0 "Chiny umacniają kontrolę nad spornymi terytoriami Morza Południowochińskiego, budując instalacje wojskowe i podważając wolność żeglugi."
 MD2026_CHI_blue_water_navy:0 "Flota oceaniczna"
 MD2026_CHI_blue_water_navy_desc:0 "Rozwój prawdziwej floty oceanicznej zdolnej do globalnej projekcji siły, z bazami zamorskimi i dalekozasięgowymi grupami uderzeniowymi lotniskowców."

 ## Germany Focuses ##
 MD2026_GER_zeitenwende_2026:0 "Zeitenwende 2026"
 MD2026_GER_zeitenwende_2026_desc:0 "Historyczny punkt zwrotny Niemiec trwa, a Berlin mierzy się z dozbrojeniem, transformacją energetyczną i rolą wiodącej potęgi Europy."
 MD2026_GER_bundeswehr_reform:0 "Reforma Bundeswehry"
 MD2026_GER_bundeswehr_reform_desc:0 "Przebudowa struktury dowodzenia i gotowości Bundeswehry po dziesięcioleciach niedofinansowania. Niemcy muszą być zdolne do walki."
 MD2026_GER_leopard_program:0 "Program czołgów Leopard"
 MD2026_GER_leopard_program_desc:0 "Przyspieszenie produkcji nowej generacji czołgu podstawowego Leopard i zapewnienie wojskom lądowym światowej klasy zdolności pancernej."
 MD2026_GER_eurofighter_upgrade:0 "Modernizacja Eurofighterów"
 MD2026_GER_eurofighter_upgrade_desc:0 "Modernizacja floty Eurofighter Typhoon o zaawansowane radary i systemy uzbrojenia, by utrzymać przewagę powietrzną nad Europą."
 MD2026_GER_european_army_corps:0 "Europejski korpus armijny"
 MD2026_GER_european_army_corps_desc:0 "Utworzenie wspólnego francusko-niemieckiego korpusu armijnego jako zalążka przyszłych europejskich sił obronnych i zacieśnienie integracji wojskowej."
 MD2026_GER_air_defense_shield:0 "Tarcza obrony powietrznej"
 MD2026_GER_air_defense_shield_desc:0 "Rozmieszczenie zintegrowanej tarczy obrony powietrznej i przeciwrakietowej nad Niemcami, zamykającej krytyczną lukę ujawnioną przez wojnę Rosji w Ukrainie."
 MD2026_GER_nato_commitment:0 "Zaangażowanie w NATO"
 MD2026_GER_nato_commitment_desc:0 "Potwierdzenie zaangażowania Niemiec w NATO i sojusz transatlantycki jako fundament bezpieczeństwa Europy."
 MD2026_GER_atlantic_solidarity:0 "Solidarność atlantycka"
 MD2026_GER_atlantic_solidarity_desc:0 "Wzmocnienie transatlantyckiej więzi z Waszyngtonem i zapewnienie trwałości amerykańskiego zaangażowania w obronę Europy."
 MD2026_GER_european_defense_pillar:0 "Europejski filar obronny"
 MD2026_GER_european_defense_pillar_desc:0 "Budowa europejskiego filaru obronnego w ramach NATO, umożliwiającego UE samodzielne działanie, gdy amerykańskie wsparcie stoi pod znakiem zapytania."
 MD2026_GER_defense_spending:0 "Zwiększenie wydatków na obronę"
 MD2026_GER_defense_spending_desc:0 "Podniesienie wydatków na obronę powyżej celu NATO wynoszącego 2% PKB, z finansowaniem nowych fabryk zbrojeniowych i programów zakupów wojskowych."
 MD2026_GER_energy_transition:0 "Energiewende 2.0"
 MD2026_GER_energy_transition_desc:0 "Rozpoczęcie kolejnego etapu niemieckiej transformacji energetycznej i ostateczne uniezależnienie się od paliw kopalnych."
 MD2026_GER_renewables_expansion:0 "Rozbudowa OZE"
 MD2026_GER_renewables_expansion_desc:0 "Ogromna rozbudowa mocy wiatrowej i słonecznej w całych Niemczech oraz budowa bazy przemysłowej dla zielonej gospodarki energetycznej."
 MD2026_GER_lng_terminals:0 "Sieć terminali LNG"
 MD2026_GER_lng_terminals_desc:0 "Dokończenie sieci terminali LNG na wybrzeżu Morza Północnego w celu dywersyfikacji dostaw gazu i uniezależnienia się od rosyjskich rurociągów."
 MD2026_GER_hydrogen_economy:0 "Gospodarka wodorowa"
 MD2026_GER_hydrogen_economy_desc:0 "Inwestycje w technologię zielonego wodoru jako paliwa przyszłości dla niemieckiego przemysłu i transportu."
 MD2026_GER_industrial_resilience:0 "Odporność przemysłowa"
 MD2026_GER_industrial_resilience_desc:0 "Odbudowa bazy przemysłowej Niemiec dzięki odpornym łańcuchom dostaw i krajowej produkcji dóbr krytycznych."
 MD2026_GER_eu_leadership:0 "Przywództwo w UE"
 MD2026_GER_eu_leadership_desc:0 "Umacnianie naturalnej roli przywódczej Niemiec w Unii Europejskiej i kierowanie wspólnotą przez erę wstrząsów geopolitycznych."
 MD2026_GER_eu_enlargement:0 "Rozszerzenie UE"
 MD2026_GER_eu_enlargement_desc:0 "Orędownictwo za rozszerzeniem UE, by przyjąć Ukrainę i inne państwa kandydujące do wspólnoty europejskiej i wzmocnić wschodnią flankę bloku."
 MD2026_GER_franco_german_engine:0 "Silnik francusko-niemiecki"
 MD2026_GER_franco_german_engine_desc:0 "Ożywienie partnerstwa francusko-niemieckiego jako siły napędowej integracji europejskiej i polityki strategicznej."
 MD2026_GER_balkans_accession:0 "Akcesja Bałkanów"
 MD2026_GER_balkans_accession_desc:0 "Przyspieszenie akcesji państw Bałkanów Zachodnich do UE, by utrwalić stabilność i przeciwdziałać zewnętrznym wpływom w regionie."
 MD2026_GER_eu_defense_fund:0 "Fundusz obronny UE"
 MD2026_GER_eu_defense_fund_desc:0 "Utworzenie wspólnego unijnego funduszu zakupów obronnych w celu połączenia zasobów i budowy zdolniejszych europejskich sił zbrojnych."
 MD2026_GER_wirtschaftswunder:0 "Wirtschaftswunder 2.0"
 MD2026_GER_wirtschaftswunder_desc:0 "Rozniecenie nowego cudu gospodarczego dzięki inwestycjom w badania, innowacje i odrodzony sektor Mittelstand."
 MD2026_GER_ai_leadership:0 "Przywództwo w AI"
 MD2026_GER_ai_leadership_desc:0 "Umieszczenie Niemiec w czołówce badań nad sztuczną inteligencją i jej wdrażania w przemyśle i administracji."
 MD2026_GER_mittelstand_innovation:0 "Innowacje Mittelstandu"
 MD2026_GER_mittelstand_innovation_desc:0 "Wzmocnienie niemieckich małych i średnich przedsiębiorstw dzięki najnowszym technologiom i zmodernizowanym metodom produkcji."
 MD2026_GER_digital_sovereignty:0 "Suwerenność cyfrowa"
 MD2026_GER_digital_sovereignty_desc:0 "Osiągnięcie suwerenności cyfrowej poprzez budowę europejskiej infrastruktury chmurowej i zmniejszenie zależności od zagranicznych platform technologicznych."
 MD2026_GER_green_technology:0 "Eksport zielonych technologii"
 MD2026_GER_green_technology_desc:0 "Eksport niemieckich zielonych technologii na cały świat i zamiana przywództwa klimatycznego w przewagę gospodarczą."
 MD2026_GER_leading_europe:0 "Przewodzić Europie"
 MD2026_GER_leading_europe_desc:0 "Niemcy biorą na siebie pełną odpowiedzialność jako wiodąca potęga Europy – gospodarczo, dyplomatycznie i militarnie."

 ### EVENTS - RUSSIA-UKRAINE ###
 md2026_ru_ukr.1.t:0 "Propozycja zawieszenia broni"
 md2026_ru_ukr.1.d:0 "Wojna w Ukrainie znalazła się w martwym punkcie. Nasze siły utrzymują zajęte terytoria, ale dalsze postępy okazują się kosztowne. Niektóre głosy w Moskwie sugerują, że nadszedł czas, by zaproponować zawieszenie broni wzdłuż obecnych linii kontroli. Pozwoliłoby nam to umocnić zdobycze i złagodzić ekonomiczne brzemię przedłużającej się wojny."
 md2026_ru_ukr.1.o1:0 "Zaproponuj zawieszenie broni wzdłuż obecnych linii"
 md2026_ru_ukr.1.o2:0 "Wojna trwa - żadnych negocjacji"

 md2026_ru_ukr.2.t:0 "Rosja proponuje zawieszenie broni"
 md2026_ru_ukr.2.d:0 "Rosja formalnie zaproponowała zawieszenie broni wzdłuż obecnych linii kontroli. Oznaczałoby to w praktyce zgodę na utratę Krymu i części Donbasu. Społeczność międzynarodowa bacznie się przygląda. Nasi sojusznicy wzywają do ostrożności, ale nasz naród jest zmęczony wojną."
 md2026_ru_ukr.2.o1:0 "Przyjmij negocjacje - musimy zakończyć rozlew krwi"
 md2026_ru_ukr.2.o2:0 "Odrzuć - nie oddamy naszej ziemi"

 md2026_ru_ukr.3.t:0 "Negocjowanie warunków"
 md2026_ru_ukr.3.d:0 "Ukraina zgodziła się na negocjacje. Teraz musimy ustalić warunki. Możemy zaakceptować strefę zdemilitaryzowaną wzdłuż obecnej linii frontu, tworząc zamrożony konflikt, albo domagać się pełnego międzynarodowego uznania naszych roszczeń terytorialnych, co grozi załamaniem rozmów."
 md2026_ru_ukr.3.o1:0 "Zaakceptuj strefę zdemilitaryzowaną - zamrożony konflikt"
 md2026_ru_ukr.3.o2:0 "Żądaj pełnego uznania zaanektowanych terytoriów"

 md2026_ru_ukr.4.t:0 "Zawieszenie broni zawarte"
 md2026_ru_ukr.4.d:0 "Wzdłuż linii frontu zawarto zawieszenie broni. Działa ucichły, ale wojna tak naprawdę się nie skończyła. Nasze terytorium pozostaje podzielone, a rosyjskie siły okupują naszą ziemię. Musimy teraz zdecydować, co dalej - skupić się na odbudowie tego, co mamy, czy przygotować się do kolejnej walki."
 md2026_ru_ukr.4.o1:0 "Skup się na odbudowie i gojeniu ran"
 md2026_ru_ukr.4.o2:0 "To tylko przerwa - przygotuj się na to, co nadejdzie"

 md2026_ru_ukr.5.t:0 "Ukraina odrzuca zawieszenie broni"
 md2026_ru_ukr.5.d:0 "Ukraina odrzuciła naszą propozycję zawieszenia broni. Wierzą, że zachodni sojusznicy będą wspierać ich bez końca i że czas działa na ich korzyść. Musimy teraz zdecydować, jak odpowiedzieć na tę odmowę."
 md2026_ru_ukr.5.o1:0 "Eskaluj - pożałują tej decyzji"
 md2026_ru_ukr.5.o2:0 "Utrzymaj obecną strategię i czekaj"

 md2026_ru_ukr.6.t:0 "Załamanie negocjacji"
 md2026_ru_ukr.6.d:0 "Rosyjskie żądanie pełnego uznania wszystkich zaanektowanych terytoriów okazało się zbyt wygórowane. Negocjacje załamały się, a wojna będzie trwać. Nasz naród jest sfrustrowany, ale nieugięty - nie zaakceptujemy warunków, które legitymizują okupację naszej ziemi."
 md2026_ru_ukr.6.o1:0 "Zjednocz naród - walczymy dalej!"
 md2026_ru_ukr.6.o2:0 "Zaapeluj do społeczności międzynarodowej o wsparcie"

 md2026_ru_ukr.10.t:0 "Propozycja pokojowa z mediacją USA"
 md2026_ru_ukr.10.d:0 "Stany Zjednoczone zaproponowały porozumienie pokojowe w konflikcie ukraińskim. Wysłannik prezydenta Trumpa przedstawia warunki, które zamroziłyby konflikt wzdłuż obecnych linii, z gwarancjami bezpieczeństwa dla obu stron. Może to być okazja do zakończenia wojny na korzystnych warunkach albo zostać uznane za amerykańską ingerencję."
 md2026_ru_ukr.10.o1:0 "Przyjmij mediację USA"
 md2026_ru_ukr.10.o2:0 "Odrzuć amerykańską ingerencję w nasze sprawy"

 md2026_ru_ukr.11.t:0 "Amerykański plan pokojowy"
 md2026_ru_ukr.11.d:0 "Rosja zaakceptowała mediację USA. Proponowane porozumienie wymagałoby od Ukrainy pogodzenia się z utratą terytoriów kontrolowanych obecnie przez Rosję w zamian za gwarancje bezpieczeństwa i ścieżkę integracji z Zachodem. To gorzka pigułka, ale mogłaby zakończyć wojnę."
 md2026_ru_ukr.11.o1:0 "Przyjmij porozumienie - zakończ wojnę"
 md2026_ru_ukr.11.o2:0 "Odrzuć - nie oddamy naszego terytorium"

 md2026_ru_ukr.12.t:0 "Porozumienie pokojowe osiągnięte"
 md2026_ru_ukr.12.d:0 "Porozumienie pokojowe w sprawie Ukrainy zostało podpisane. Obie strony poszły na ustępstwa, ale wojna się skończyła. To wielkie zwycięstwo dyplomatyczne Stanów Zjednoczonych i dowód, że amerykańskie przywództwo wciąż potrafi rozwiązywać najgroźniejsze konflikty świata."
 md2026_ru_ukr.12.o1:0 "Triumf amerykańskiej dyplomacji"

 md2026_ru_ukr.13.t:0 "Wysiłki pokojowe zakończyły się niepowodzeniem"
 md2026_ru_ukr.13.d:0 "Nasza inicjatywa pokojowa w sprawie Ukrainy zakończyła się fiaskiem. Jedna lub obie strony odrzuciły zaproponowane przez nas warunki. Wojna będzie trwać, a amerykańska wiarygodność jako mediatora ucierpiała. Musimy teraz ponownie przemyśleć nasze podejście do tego konfliktu."
 md2026_ru_ukr.13.o1:0 "Próbowaliśmy. Wojna trwa dalej."

 md2026_ru_ukr_news.1.t:0 "Zawieszenie broni w Ukrainie!"
 md2026_ru_ukr_news.1.d:0 "Po latach brutalnych walk Rosja i Ukraina ogłosiły zawieszenie broni. Wzdłuż linii frontu ucichły działa, choć źródło konfliktu pozostaje nierozwiązane. Społeczność międzynarodowa ostrożnie wita te wieści."
 md2026_ru_ukr_news.1.o1:0 "Kruchy pokój..."

 md2026_ru_ukr_news.2.t:0 "Załamanie rozmów pokojowych"
 md2026_ru_ukr_news.2.d:0 "Negocjacje między Rosją a Ukrainą załamały się. Obie strony nie potrafiły uzgodnić warunków zakończenia konfliktu. Wojna będzie trwać, budząc obawy o dalszą eskalację i cierpienie humanitarne."
 md2026_ru_ukr_news.2.o1:0 "Wojna trwa dalej..."

 md2026_ru_ukr_news.3.t:0 "Podpisano porozumienie pokojowe wynegocjowane przez USA!"
 md2026_ru_ukr_news.3.d:0 "W historycznym momencie Rosja i Ukraina podpisały wynegocjowane przez USA porozumienie pokojowe, kończąc lata wyniszczającej wojny. Porozumienie zamraża konflikt wzdłuż obecnych linii kontroli i ustanawia gwarancje bezpieczeństwa dla obu stron."
 md2026_ru_ukr_news.3.o1:0 "Zaczyna się nowy rozdział"

 ### EVENTS - TAIWAN ###
 md2026_taiwan.1.t:0 "Decyzja w sprawie Tajwanu"
 md2026_taiwan.1.d:0 "Nasze przygotowania wojskowe naprzeciw Tajwanu zostały zakończone. Armia Ludowo-Wyzwoleńcza jest gotowa wymusić zjednoczenie wszelkimi niezbędnymi środkami. Nadszedł moment decyzji. Możemy wprowadzić blokadę morską, by zmusić Tajpej do uległości, rozpocząć pełną inwazję desantową albo zademonstrować siłę podczas ćwiczeń wojskowych, zachowując otwarte wszystkie opcje."
 md2026_taiwan.1.o1:0 "Wprowadź blokadę morską Tajwanu"
 md2026_taiwan.1.o2:0 "Rozpocznij pełnoskalową inwazję"
 md2026_taiwan.1.o3:0 "Tylko ćwiczenia wojskowe - zademonstruj siłę"

 md2026_taiwan.2.t:0 "Chiny blokują Tajwan"
 md2026_taiwan.2.d:0 "Chiny wprowadziły blokadę morską Tajwanu, odcinając wyspę od handlu morskiego. To akt agresji, który zagraża kluczowemu sojusznikowi i globalnemu łańcuchowi dostaw półprzewodników. Marynarka wojenna USA jest w stanie przełamać blokadę, ale wiąże się to z ryzykiem bezpośredniej konfrontacji militarnej z Chinami."
 md2026_taiwan.2.o1:0 "Wyślij marynarkę wojenną, by przełamać blokadę"
 md2026_taiwan.2.o2:0 "Tylko protest dyplomatyczny i sankcje"
 md2026_taiwan.2.o3:0 "Zaakceptuj nowe status quo"

 md2026_taiwan.3.t:0 "Chiny blokują Tajwan"
 md2026_taiwan.3.d:0 "Chiny wprowadziły blokadę morską Tajwanu, bezpośrednio zagrażając stabilności regionu i japońskim interesom bezpieczeństwa. Nasze Siły Samoobrony mogłyby wesprzeć amerykańskie operacje morskie mające przełamać blokadę, ale oznaczałoby to historyczny zwrot w powojennej postawie obronnej Japonii."
 md2026_taiwan.3.o1:0 "Wesprzyj amerykańskie operacje morskie"
 md2026_taiwan.3.o2:0 "Na razie zachowaj neutralność"

 md2026_taiwan.4.t:0 "Chiny dokonują inwazji na Tajwan!"
 md2026_taiwan.4.d:0 "Chiny rozpoczęły pełnoskalową inwazję desantową na Tajwan. To najniebezpieczniejszy kryzys wojskowy od czasów II wojny światowej. Ustawa o stosunkach z Tajwanem zobowiązuje nas do pomocy Tajwanowi w samoobronie, ale bezpośrednia interwencja oznacza wojnę z mocarstwem jądrowym."
 md2026_taiwan.4.o1:0 "Broń Tajwanu - idziemy na wojnę"
 md2026_taiwan.4.o2:0 "Dostarcz broń i wsparcie, ale bez bezpośredniej interwencji"
 md2026_taiwan.4.o3:0 "To nie nasza wojna"

 md2026_taiwan.5.t:0 "Chiny dokonują inwazji na Tajwan!"
 md2026_taiwan.5.d:0 "Chiny rozpoczęły pełnoskalową inwazję na Tajwan. Największa operacja desantowa od czasów D-Day grozi przekształceniem całego porządku Indo-Pacyfiku. Japonia staje przed egzystencjalnym dylematem: interweniować w obronie sąsiedniej demokracji czy zadbać o własne bezpieczeństwo, trzymając się z boku?"
 md2026_taiwan.5.o1:0 "Przyłącz się do obrony Tajwanu"
 md2026_taiwan.5.o2:0 "Wzmocnij naszą obronę, ale nie interweniuj"

 md2026_taiwan.6.t:0 "Amerykanie rzucają wyzwanie naszej blokadzie"
 md2026_taiwan.6.d:0 "Marynarka wojenna Stanów Zjednoczonych skierowała w stronę Tajwanu lotniskowcowe grupy uderzeniowe, rzucając bezpośrednie wyzwanie naszej blokadzie. Jeśli podejmiemy konfrontację, ryzykujemy wojnę między mocarstwami jądrowymi. Jeśli ustąpimy, stracimy twarz, a nasza strategia wobec Tajwanu upadnie."
 md2026_taiwan.6.o1:0 "Podejmij konfrontację z marynarką USA"
 md2026_taiwan.6.o2:0 "Ustąp i znieś blokadę"
 md2026_taiwan.6.o3:0 "Utrzymaj blokadę, ale unikaj bezpośredniej konfrontacji"

 md2026_taiwan_news.1.t:0 "Chiny blokują Tajwan!"
 md2026_taiwan_news.1.d:0 "Chińska Republika Ludowa wprowadziła blokadę morską wokół Tajwanu, odcinając wyspę od handlu morskiego. Globalne rynki gwałtownie spadają, a światowy łańcuch dostaw półprzewodników staje w obliczu zakłóceń. Światowi przywódcy apelują o powściągliwość."
 md2026_taiwan_news.1.o1:0 "Świat przygląda się z niepokojem"

 md2026_taiwan_news.2.t:0 "Chiny dokonują inwazji na Tajwan!"
 md2026_taiwan_news.2.d:0 "Chiny rozpoczęły pełnoskalową inwazję desantową na Tajwan. Setki tysięcy żołnierzy Armii Ludowo-Wyzwoleńczej przekraczają Cieśninę Tajwańską w największej operacji wojskowej od czasów II wojny światowej. Świat wstrzymuje oddech, a ryzyko wojny globalnej gwałtownie rośnie."
 md2026_taiwan_news.2.o1:0 "Boże, dopomóż nam wszystkim"

 md2026_taiwan_news.3.t:0 "Chiny znoszą blokadę Tajwanu"
 md2026_taiwan_news.3.d:0 "W obliczu amerykańskiej presji morskiej Chiny zniosły blokadę Tajwanu. Kryzys na razie minął, ale napięcie w Cieśninie Tajwańskiej pozostaje niebezpiecznie wysokie. Globalne rynki odrabiają straty, a szlaki żeglugowe znów są otwarte."
 md2026_taiwan_news.3.o1:0 "Kryzys zażegnany... na razie"

 ### EVENTS - MIDDLE EAST ###
 md2026_mideast.1.t:0 "Odbudowa Syrii"
 md2026_mideast.1.d:0 "Reżim Assada upadł, a Syria stoi przed monumentalnym zadaniem odbudowy. Nowy rząd musi zdecydować o kierunku rozwoju kraju: obrać świecki, inkluzywny model, który mógłby przyciągnąć zachodnie wsparcie, przyjąć islamskie ramy ustrojowe odzwierciedlające wartości rewolucji albo zaakceptować fragmentaryczny układ podziału władzy."
 md2026_mideast.1.o1:0 "Prowadź świecką odbudowę"
 md2026_mideast.1.o2:0 "Rządy o orientacji islamskiej"
 md2026_mideast.1.o3:0 "Zaakceptuj fragmentację i podział władzy"

 md2026_mideast.2.t:0 "Międzynarodowa konferencja pomocowa"
 md2026_mideast.2.d:0 "Społeczność międzynarodowa jest gotowa udzielić Syrii pomocy na odbudowę, ale różni darczyńcy stawiają różne warunki. Państwa zachodnie żądają reform demokratycznych i gwarancji praw człowieka, podczas gdy państwa arabskie regionu oferują wsparcie z mniejszą liczbą zobowiązań."
 md2026_mideast.2.o1:0 "Przyjmij zachodnią pomoc z warunkami"
 md2026_mideast.2.o2:0 "Szukaj wsparcia regionalnych państw arabskich"

 md2026_mideast.10.t:0 "Kwestia Strefy Gazy"
 md2026_mideast.10.d:0 "Sytuacja w Strefie Gazy wymaga strategicznej decyzji. Nasze operacje wojskowe osiągnęły wstępne cele, ale koszty humanitarne i dyplomatyczne wciąż rosną. Musimy wyznaczyć kierunek działania, który zrównoważy potrzeby bezpieczeństwa z presją międzynarodową i dyplomacją regionalną."
 md2026_mideast.10.o1:0 "Kontynuuj operacje wojskowe"
 md2026_mideast.10.o2:0 "Dąż do zawieszenia broni i negocjacji"
 md2026_mideast.10.o3:0 "Skup się na rozszerzaniu Porozumień Abrahamowych"

 md2026_mideast.20.t:0 "Na nuklearnym rozdrożu"
 md2026_mideast.20.d:0 "Nasz program nuklearny osiągnął krytyczny moment. Dysponujemy technicznymi możliwościami wzbogacania uranu do poziomu broni jądrowej w ciągu kilku miesięcy. Najwyższy Przywódca musi zdecydować: dążyć do zdolności do zbudowania broni jądrowej jako ostatecznego środka odstraszania, wynegocjować nowe porozumienie z Zachodem, by złagodzić sankcje, czy zachować strategiczną niejednoznaczność."
 md2026_mideast.20.o1:0 "Przyspiesz wzbogacanie - dąż do zdolności do zbudowania broni jądrowej"
 md2026_mideast.20.o2:0 "Wynegocjuj nowe porozumienie z Zachodem"
 md2026_mideast.20.o3:0 "Zachowaj strategiczną niejednoznaczność"

 md2026_mideast.21.t:0 "Iran zbliża się do zdolności do zbudowania broni jądrowej"
 md2026_mideast.21.d:0 "Raporty wywiadu potwierdzają, że Iran szybko zbliża się do zdolności wytworzenia broni jądrowej. Stanowi to egzystencjalne zagrożenie dla Izraela. Musimy zdecydować, jak odpowiedzieć: przeprowadzić wyprzedzające uderzenie na irańskie obiekty nuklearne, wywierać maksymalną presję dyplomatyczną za pośrednictwem sojuszników czy przyspieszyć rozwój własnych zdolności odstraszania."
 md2026_mideast.21.o1:0 "Wyprzedzające uderzenie na obiekty nuklearne"
 md2026_mideast.21.o2:0 "Maksymalna presja dyplomatyczna przez sojuszników"
 md2026_mideast.21.o3:0 "Przyspiesz rozwój własnego odstraszania"

 md2026_mideast.22.t:0 "Irański kryzys nuklearny"
 md2026_mideast.22.d:0 "Iran zbliża się do zdolności wytworzenia broni jądrowej. Zagraża to całemu reżimowi nieproliferacji i stabilności regionu. Musimy zdecydować, jak odpowiedzieć na to rosnące zagrożenie."
 md2026_mideast.22.o1:0 "Kampania maksymalnej presji i sankcji"
 md2026_mideast.22.o2:0 "Wesprzyj działania Izraela, jeśli będzie to konieczne"
 md2026_mideast.22.o3:0 "Zaakceptuj Iran jako państwo na progu zdolności nuklearnych"

 md2026_mideast.30.t:0 "Droga Jemenu"
 md2026_mideast.30.d:0 "Jemen stoi na rozdrożu. Ruch Huti umocnił kontrolę nad znaczną częścią kraju, ale presja międzynarodowa i interwencja saudyjska zrobiły swoje. Rząd jedności narodowej mógłby przynieść stabilność albo Huti mogą jeszcze bardziej zacieśnić sojusz z Iranem."
 md2026_mideast.30.o1:0 "Utwórz rząd jedności narodowej"
 md2026_mideast.30.o2:0 "Kontynuuj pod dominacją Huti"

 md2026_mideast_news.1.t:0 "Zawieszenie broni w konflikcie izraelsko-palestyńskim"
 md2026_mideast_news.1.d:0 "Izrael zgodził się na zawieszenie broni w konflikcie w Strefie Gazy i rozpoczął negocjacje w sprawie szerszego porozumienia pokojowego. Społeczność międzynarodowa wita te wieści, choć wielu pozostaje sceptycznych co do trwałego pokoju."
 md2026_mideast_news.1.o1:0 "Nadzieja na pokój na Bliskim Wschodzie"

 md2026_mideast_news.2.t:0 "Irański kryzys nuklearny eskaluje"
 md2026_mideast_news.2.d:0 "Iran przyspieszył swój program wzbogacania uranu do poziomu broni jądrowej, wywołując wstrząs w społeczności międzynarodowej. Izrael i Stany Zjednoczone rozważają możliwe odpowiedzi, a reżim nieproliferacji staje przed największym wyzwaniem w swojej historii."
 md2026_mideast_news.2.o1:0 "Świat patrzy z trwogą"

 ### EVENTS - ELECTIONS ###
 md2026_elections.1.t:0 "Wybory powszechne"
 md2026_elections.1.d:0 "Nadszedł czas wyborów powszechnych. Kampania była zaciekle rywalizowana między tradycyjnymi partiami a nowymi ruchami politycznymi. Wyborcy zdecydują o kierunku rozwoju kraju na najbliższe lata."
 md2026_elections.1.o1:0 "Zwycięża koalicja centroprawicowa"
 md2026_elections.1.o2:0 "Zwycięża koalicja centrolewicowa"
 md2026_elections.1.o3:0 "Populistyczny wzrost wstrząsa establishmentem"
 md2026_elections.1.o4:0 "Urzędujący utrzymuje władzę"

 md2026_elections.10.t:0 "Wybory do Kongresu (midterm) 2028"
 md2026_elections.10.d:0 "Wybory do Kongresu (midterm) w 2028 roku zdecydują o układzie sił w Kongresie. Polityka Trumpa zmobilizowała zarówno jego zwolenników, jak i przeciwników. Wynik wyborów ukształtuje resztę tej kadencji prezydenckiej."
 md2026_elections.10.o1:0 "Republikanie utrzymują Kongres"
 md2026_elections.10.o2:0 "Demokraci odzyskują Kongres"
 md2026_elections.10.o3:0 "Podzielony Kongres - paraliż legislacyjny"

 md2026_elections.20.t:0 "Wybory prezydenckie we Francji 2027"
 md2026_elections.20.d:0 "Francja idzie do urn, by wybrać kolejnego prezydenta. Kadencja Macrona dobiega końca, a wyścig jest całkowicie otwarty. Centrum, prawica pod wodzą Zjednoczenia Narodowego Marine Le Pen i koalicja lewicowa walczą o Pałac Elizejski."
 md2026_elections.20.o1:0 "Koalicja centrowa utrzymuje władzę"
 md2026_elections.20.o2:0 "Zwycięstwo prawicy - moment Le Pen"
 md2026_elections.20.o3:0 "Koalicja lewicowa zdobywa prezydenturę"

 ### EVENTS - BRICS ###
 md2026_brics.1.t:0 "Szczyt rozszerzenia BRICS+"
 md2026_brics.1.d:0 "Sojusz BRICS+ organizuje doroczny szczyt. Rosja jako gospodarz zabiega o rozszerzenie składu i wpływów bloku jako przeciwwagi dla instytucji zdominowanych przez Zachód. Kilka państw wyraziło zainteresowanie przystąpieniem, co mogłoby przekształcić globalny porządek gospodarczy."
 md2026_brics.1.o1:0 "Naciskaj na szybkie rozszerzenie"
 md2026_brics.1.o2:0 "Skup się na współpracy gospodarczej wśród obecnych członków"

 md2026_brics.2.t:0 "Oferta członkostwa w BRICS+"
 md2026_brics.2.d:0 "Turcja otrzymała zaproszenie do BRICS+. Byłby to historyczny zwrot dla państwa członkowskiego NATO, potencjalnie nadwerężający zachodnie sojusze. Możliwości gospodarcze są znaczące, ale konsekwencje geopolityczne są głębokie."
 md2026_brics.2.o1:0 "Wstąp do BRICS+"
 md2026_brics.2.o2:0 "Odmów - skup się na NATO i UE"
 md2026_brics.2.o3:0 "Tylko status obserwatora"

 md2026_brics.3.t:0 "Rola Indii w BRICS+"
 md2026_brics.3.d:0 "Rozszerzony sojusz BRICS+ daje Indiom szansę na współkształtowanie rodzącego się multipolarnego porządku świata. Jako najludniejsze państwo świata Indie mogą objąć przewodnią rolę w agendzie gospodarczej albo balansować między BRICS+ a orientacją na Zachód."
 md2026_brics.3.o1:0 "Przewodź agendzie gospodarczej"
 md2026_brics.3.o2:0 "Balansuj między BRICS+ a orientacją na Zachód"

 md2026_brics.10.t:0 "Inicjatywa dedolaryzacji"
 md2026_brics.10.d:0 "Chiny proponują śmiałą inicjatywę: wspólną walutę BRICS+ lub mechanizm rozliczeniowy, który ograniczyłby zależność od dolara amerykańskiego w handlu międzynarodowym. Mogłoby to zasadniczo przekształcić globalny system finansowy."
 md2026_brics.10.o1:0 "Uruchom inicjatywę wspólnej waluty BRICS+"
 md2026_brics.10.o2:0 "Zamiast tego przeprowadź dwustronne swapy walutowe"

 md2026_brics.11.t:0 "Wyzwanie dedolaryzacji"
 md2026_brics.11.d:0 "Chiny i Rosja promują alternatywy dla dolara amerykańskiego w handlu międzynarodowym. Choć dominacja dolara nie jest bezpośrednio zagrożona, tendencja ta niepokoi. Musimy zareagować, by chronić amerykańskie interesy gospodarcze."
 md2026_brics.11.o1:0 "Kontrśrodki gospodarcze i sankcje"
 md2026_brics.11.o2:0 "Wzmocnij dolara poprzez politykę wewnętrzną"

 md2026_brics_news.1.t:0 "BRICS+ się rozszerza!"
 md2026_brics_news.1.d:0 "Sojusz BRICS+ ogłosił wielkie rozszerzenie, witając nowe państwa członkowskie. Blok reprezentuje obecnie znaczącą część światowego PKB i populacji, pozycjonując się jako alternatywa dla instytucji kierowanych przez Zachód."
 md2026_brics_news.1.o1:0 "Kształtuje się nowy porządek świata"

 md2026_brics_news.2.t:0 "Dedolaryzacja się zaczyna"
 md2026_brics_news.2.d:0 "Państwa BRICS+ uruchomiły formalną inicjatywę mającą ograniczyć zależność od dolara amerykańskiego w handlu międzynarodowym. Globalny system finansowy staje przed najpoważniejszym wyzwaniem od czasu upadku systemu z Bretton Woods."
 md2026_brics_news.2.o1:0 "Świat finansów już nigdy nie będzie taki sam"

 ### EVENTS - NATO-RUSSIA ###
 md2026_nato_russia.1.t:0 "Incydent graniczny"
 md2026_nato_russia.1.d:0 "Na naszej granicy z Rosją doszło do poważnego incydentu. Rosyjskie samoloty wojskowe naruszyły naszą przestrzeń powietrzną, a między siłami granicznymi doszło do krótkiej konfrontacji. Choć nie padły strzały, sytuacja jest niezwykle napięta. Musimy zdecydować, jak zareagować."
 md2026_nato_russia.1.o1:0 "Zwołaj konsultacje w ramach Artykułu 5"
 md2026_nato_russia.1.o2:0 "Załatw to dwustronnie z Rosją"
 md2026_nato_russia.1.o3:0 "Zwiększ patrole graniczne i deeskaluj"

 md2026_nato_russia.2.t:0 "Konsultacje NATO w ramach Artykułu 5"
 md2026_nato_russia.2.d:0 "Sojusznik NATO zwołał konsultacje w ramach Artykułu 5 po incydencie granicznym z Rosją. Jako wiodące mocarstwo sojuszu musimy zdecydować, jak zareagować. Rozmieszczenie dodatkowych sił na wschodniej flance odstraszyłoby Rosję, ale niesie ryzyko eskalacji."
 md2026_nato_russia.2.o1:0 "Rozmieść dodatkowe siły na wschodniej flance"
 md2026_nato_russia.2.o2:0 "Wydaj Rosji ostrzeżenie dyplomatyczne"
 md2026_nato_russia.2.o3:0 "Zbagatelizuj incydent"

 md2026_nato_russia.3.t:0 "NATO rozmieszcza siły na naszych granicach"
 md2026_nato_russia.3.d:0 "NATO rozmieściło dodatkowe siły na naszych zachodnich granicach w odpowiedzi na incydent graniczny. Ta koncentracja wojsk stanowi bezpośrednie zagrożenie dla bezpieczeństwa Rosji. Musimy zdecydować, jak odpowiedzieć na tę prowokację."
 md2026_nato_russia.3.o1:0 "Odpowiedz na koncentrację NATO własnymi siłami"
 md2026_nato_russia.3.o2:0 "Nuklearne pobrzękiwanie szablą"
 md2026_nato_russia.3.o3:0 "Zaproponuj rozmowy deeskalacyjne"

 md2026_nato_russia.4.t:0 "Dwustronna rozmowa o incydencie"
 md2026_nato_russia.4.d:0 "Poszkodowane państwo NATO podniosło sprawę incydentu granicznego kanałami dwustronnymi, zamiast powoływać się na Artykuł 5. Strona ta szuka wyjaśnień i zapewnień, że takie incydenty się nie powtórzą."
 md2026_nato_russia.4.o1:0 "Zaprzecz jakiemukolwiek udziałowi"
 md2026_nato_russia.4.o2:0 "Przeproś i współpracuj"

 md2026_nato_russia.10.t:0 "Poważny atak cybernetyczny"
 md2026_nato_russia.10.d:0 "Nasza infrastruktura krytyczna padła ofiarą zaawansowanego ataku cybernetycznego przypisywanego hakerom sponsorowanym przez rosyjskie państwo. Sieci energetyczne, systemy finansowe i sieci rządowe zostały naruszone. To akt wojny hybrydowej, który wymaga odpowiedzi."
 md2026_nato_russia.10.o1:0 "Odpowiedz kontratakiem cybernetycznym"
 md2026_nato_russia.10.o2:0 "Wzmocnij obronę cybernetyczną"
 md2026_nato_russia.10.o3:0 "Publiczne wskazanie winnych i międzynarodowe potępienie"

 md2026_nato_russia_news.1.t:0 "Incydent graniczny NATO-Rosja"
 md2026_nato_russia_news.1.d:0 "Poważny incydent graniczny między państwem członkowskim NATO a Rosją podniósł napięcie do najwyższego poziomu od czasów zimnej wojny. Sojusz konsultuje swoją odpowiedź, a świat przygląda się z niepokojem."
 md2026_nato_russia_news.1.o1:0 "Napięcie w Europie rośnie"

 md2026_nato_russia_news.2.t:0 "Poważny atak cybernetyczny uderza w państwo NATO"
 md2026_nato_russia_news.2.d:0 "Niszczycielski atak cybernetyczny uderzył w infrastrukturę krytyczną państwa członkowskiego NATO. Agencje wywiadowcze przypisują atak hakerom sponsorowanym przez rosyjskie państwo. Atak podkreśla rosnące zagrożenie wojną hybrydową."
 md2026_nato_russia_news.2.o1:0 "Nowe pole bitwy jest cyfrowe"

 ### EVENTS - MIGRATION ###
 md2026_migration.1.t:0 "Fala migracji"
 md2026_migration.1.d:0 "Nowa fala migracji z Afryki i Bliskiego Wschodu wystawia na próbę nasze granice i systemy społeczne. Codziennie przybywają tysiące ludzi, uciekając przed konfliktami, biedą i zmianami klimatu. Nasza reakcja określi tożsamość kraju i kierunek polityczny na wiele lat."
 md2026_migration.1.o1:0 "Otwarte granice - przyjmuj uchodźców"
 md2026_migration.1.o2:0 "Kontrolowana imigracja z kwotami"
 md2026_migration.1.o3:0 "Zamknij granice"

 md2026_migration.2.t:0 "Kryzys paktu migracyjnego UE"
 md2026_migration.2.d:0 "Kryzys migracyjny obnażył głębokie podziały w Unii Europejskiej. Jako największa gospodarka bloku Niemcy muszą zdecydować, czy zabiegać o solidarne rozłożenie obciążeń w całej UE poprzez obowiązkowe kwoty, czy pogodzić się z tym, że każde państwo będzie radzić sobie z migracją po swojemu."
 md2026_migration.2.o1:0 "Zabiegaj o solidarne rozłożenie obciążeń w całej UE"
 md2026_migration.2.o2:0 "Zaakceptuj rozwiązania narodowe"

 md2026_migration.3.t:0 "Solidarne rozłożenie obciążeń migracyjnych w UE"
 md2026_migration.3.d:0 "Niemcy zabiegają o obowiązkowe kwoty migracyjne w UE. Nasz kraj musi zdecydować, czy zaakceptować te kwoty, zaoferować wkład finansowy zamiast przyjmowania migrantów, czy całkowicie odmówić w obronie suwerenności narodowej."
 md2026_migration.3.o1:0 "Zaakceptuj unijne kwoty migracyjne"
 md2026_migration.3.o2:0 "Zamiast tego wnieś wkład finansowy"
 md2026_migration.3.o3:0 "Odmów całkowicie - suwerenność przede wszystkim"

 md2026_migration.10.t:0 "Populistyczna reakcja"
 md2026_migration.10.d:0 "Nasza polityka otwartych granic wywołała populistyczną reakcję. Antyimigracyjne partie zyskują w sondażach, a nastroje społeczne odwracają się od polityki migracyjnej rządu. Musimy zdecydować, jak odpowiedzieć na tę rosnącą presję polityczną."
 md2026_migration.10.o1:0 "Odpowiedz na populistyczne obawy reformami"
 md2026_migration.10.o2:0 "Podtrzymaj progresywną politykę migracyjną"
  md2026_migration.10.o3:0 "Skręć w prawo w polityce imigracyjnej"

 ### FOCUS TREES - INDIA (RAJ) ###
 MD2026_RAJ_indias_century:0 "Indyjskie stulecie"
 MD2026_RAJ_indias_century_desc:0 "XXI wiek należy do Indii. Z największą populacją świata i prężnie rozwijającą się gospodarką nadszedł czas, by upomnieć się o nasze miejsce na światowej scenie."
 MD2026_RAJ_make_in_india:0 "Make in India 2.0"
 MD2026_RAJ_make_in_india_desc:0 "Rozbuduj krajowe zdolności produkcyjne i ogranicz zależność od zagranicznego importu dzięki ogromnym inwestycjom przemysłowym."
 MD2026_RAJ_digital_india:0 "Rozbudowa Digital India"
 MD2026_RAJ_digital_india_desc:0 "Przyspiesz rozwój infrastruktury cyfrowej i przekształć indyjski sektor technologiczny w globalną potęgę."
 MD2026_RAJ_semiconductor_push:0 "Nacisk na półprzewodniki"
 MD2026_RAJ_semiconductor_push_desc:0 "Zainwestuj duże środki w krajową produkcję półprzewodników, aby ograniczyć zależność od zagranicznych dostaw układów."
 MD2026_RAJ_strategic_autonomy:0 "Autonomia strategiczna"
 MD2026_RAJ_strategic_autonomy_desc:0 "Indie obierają własny kurs w multipolarnym świecie, równoważąc relacje ze wszystkimi mocarstwami."
 MD2026_RAJ_quad_deepening:0 "Pogłębienie Quad"
 MD2026_RAJ_quad_deepening_desc:0 "Wzmocnij Dialog Bezpieczeństwa Czterostronnego z USA, Japonią i Australią, aby przeciwdziałać chińskim wpływom w regionie Indo-Pacyfiku."
 MD2026_RAJ_brics_balance:0 "Równowaga w BRICS+"
 MD2026_RAJ_brics_balance_desc:0 "Wykorzystaj pozycję Indii w BRICS+, zachowując niezależność od chińskich i rosyjskich interesów."
 MD2026_RAJ_china_border:0 "Umocnienie granicy"
 MD2026_RAJ_china_border_desc:0 "Wzmocnij obronę wzdłuż Linii Rzeczywistej Kontroli po starciach w dolinie Galwan. Indie nie ustąpią ani piędzi ziemi."
 MD2026_RAJ_military_modernization:0 "Modernizacja armii"
 MD2026_RAJ_military_modernization_desc:0 "Przekształć indyjskie siły zbrojne dzięki rodzimym systemom uzbrojenia i nowoczesnej doktrynie."
 MD2026_RAJ_space_power:0 "Mocarstwo kosmiczne"
 MD2026_RAJ_space_power_desc:0 "Oprzyj się na sukcesach ISRO — od Chandrayaan po Gaganyaan — aby ugruntować pozycję Indii jako wiodącego mocarstwa kosmicznego."
 MD2026_RAJ_defense_production:0 "Produkcja zbrojeniowa"
 MD2026_RAJ_defense_production_desc:0 "Uczyń z Indii globalne centrum produkcji zbrojeniowej, wytwarzające na dużą skalę rodzime czołgi, samoloty i okręty."
 MD2026_RAJ_green_energy:0 "Rewolucja zielonej energii"
 MD2026_RAJ_green_energy_desc:0 "Inwestuj w energię słoneczną, wiatrową i wodorową, aby napędzać rozwój Indii i ograniczyć zależność od paliw kopalnych."
 MD2026_RAJ_multi_alignment:0 "Doktryna wielokierunkowości"
 MD2026_RAJ_multi_alignment_desc:0 "Sformalizuj wielokierunkową strategię Indii, utrzymując relacje strategiczne ze wszystkimi mocarstwami na własnych warunkach."
 MD2026_RAJ_lac_fortification:0 "Umocnienie LAC"
 MD2026_RAJ_lac_fortification_desc:0 "Umocnij Linię Rzeczywistej Kontroli bunkrami, drogami i wysuniętymi bazami, aby zapobiec chińskim wtargnięciom."
 MD2026_RAJ_mountain_strike:0 "Górski korpus uderzeniowy"
 MD2026_RAJ_mountain_strike_desc:0 "Sformuj i wyposaż specjalne górskie korpusy uderzeniowe zdolne do działań ofensywnych w Himalajach."
 MD2026_RAJ_agni_deterrent:0 "Odstraszanie Agni"
 MD2026_RAJ_agni_deterrent_desc:0 "Rozbuduj indyjski potencjał odstraszania jądrowego o zaawansowane pociski serii Agni zdolne dosięgnąć każdego przeciwnika."
 MD2026_RAJ_blue_water_navy:0 "Marynarka pełnomorska"
 MD2026_RAJ_blue_water_navy_desc:0 "Przekształć indyjską marynarkę w siłę pełnomorską zdolną do rzutowania potęgi na całym Oceanie Indyjskim i poza nim."
 MD2026_RAJ_carrier_program:0 "Program lotniskowców"
 MD2026_RAJ_carrier_program_desc:0 "Przyspiesz rodzimy program lotniskowców, aby stworzyć flotę wielu lotniskowców do rzutowania potęgi."
 MD2026_RAJ_submarine_fleet:0 "Flota podwodna"
 MD2026_RAJ_submarine_fleet_desc:0 "Rozbuduj indyjską flotę okrętów podwodnych o jednostki jądrowe i konwencjonalne, aby zapewnić dominację podwodną na Oceanie Indyjskim."
 MD2026_RAJ_indian_ocean_dominance:0 "Dominacja na Oceanie Indyjskim"
 MD2026_RAJ_indian_ocean_dominance_desc:0 "Ustanów niekwestionowaną indyjską dominację morską na Oceanie Indyjskim, od Cieśniny Ormuz po Cieśninę Malakka."
 MD2026_RAJ_andaman_command:0 "Dowództwo Andamanów i Nikobarów"
 MD2026_RAJ_andaman_command_desc:0 "Rozbuduj Andamany i Nikobary w wielką wysuniętą bazę morską kontrolującą wschodnie podejścia do Oceanu Indyjskiego."
 MD2026_RAJ_isro_expansion:0 "Rozbudowa ISRO"
 MD2026_RAJ_isro_expansion_desc:0 "Rozszerz możliwości ISRO dzięki cięższym rakietom nośnym i stałej obecności człowieka w kosmosie."
 MD2026_RAJ_ai_hub:0 "Centrum badań nad SI"
 MD2026_RAJ_ai_hub_desc:0 "Uczyń z Indii globalne centrum badań i rozwoju sztucznej inteligencji, wykorzystując jej ogromny potencjał kadrowy."
 MD2026_RAJ_moon_mission:0 "Program księżycowy Chandrayaan"
 MD2026_RAJ_moon_mission_desc:0 "Oprzyj się na sukcesie Chandrayaan-3 i zrealizuj ambitny program księżycowy, w tym misję lądowania z załogą."
 MD2026_RAJ_quantum_computing:0 "Komputery kwantowe"
 MD2026_RAJ_quantum_computing_desc:0 "Inwestuj w badania nad komputerami kwantowymi, aby zapewnić Indiom pozycję na czele technologii informatycznych nowej generacji."
 MD2026_RAJ_vishwaguru:0 "Vishwaguru"
 MD2026_RAJ_vishwaguru_desc:0 "Indie wyłaniają się jako Vishwaguru — nauczyciel świata — mocarstwo cywilizacyjne przewodzące w technologii, obronności i dyplomacji."

 ### FOCUS TREES - JAPAN (JAP) ###
 MD2026_JAP_active_defense:0 "Aktywna obrona"
 MD2026_JAP_active_defense_desc:0 "Japonia musi dostosować swoją postawę obronną do realiów 2026 roku. Zagrożenia ze strony Chin i Korei Północnej wymagają bardziej proaktywnego podejścia."
 MD2026_JAP_constitutional_reform:0 "Reforma artykułu 9"
 MD2026_JAP_constitutional_reform_desc:0 "Zreformuj artykuł 9 konstytucji, aby przyznać Japonii pełne zdolności wojskowe i zakończyć dekady pacyfistycznych ograniczeń."
 MD2026_JAP_counterattack_capability:0 "Zdolność do kontrataku"
 MD2026_JAP_counterattack_capability_desc:0 "Rozwijaj zdolności uderzeniowe dalekiego zasięgu, aby odstraszać przeciwników. Japonia nie może dłużej opierać się wyłącznie na środkach obronnych."
 MD2026_JAP_indo_pacific:0 "Strategia indo-pacyficzna"
 MD2026_JAP_indo_pacific_desc:0 "Rozszerz japońskie partnerstwa strategiczne w regionie Indo-Pacyfiku, aby utrzymać porządek oparty na zasadach."
 MD2026_JAP_taiwan_contingency:0 "Scenariusz tajwański"
 MD2026_JAP_taiwan_contingency_desc:0 "Przygotuj plany awaryjne na wypadek kryzysu wokół Tajwanu. Bezpieczeństwo Japonii jest bezpośrednio związane ze statusem Tajwanu."
 MD2026_JAP_korea_reconciliation:0 "Pojednanie z Koreą"
 MD2026_JAP_korea_reconciliation_desc:0 "Popraw relacje z Koreą Południową, aby wspólnie stawić czoła wspólnym zagrożeniom."
 MD2026_JAP_economic_revitalization:0 "Ożywienie gospodarcze"
 MD2026_JAP_economic_revitalization_desc:0 "Ożyw japońską gospodarkę dzięki reformom strukturalnym i innowacjom technologicznym po dekadach stagnacji."
 MD2026_JAP_tech_sovereignty:0 "Suwerenność technologiczna"
 MD2026_JAP_tech_sovereignty_desc:0 "Inwestuj w najnowocześniejsze technologie — półprzewodniki, komputery kwantowe, SI — aby utrzymać japońską przewagę technologiczną."
 MD2026_JAP_missile_defense:0 "System Aegis Ashore"
 MD2026_JAP_missile_defense_desc:0 "Rozmieszczaj zaawansowane systemy obrony przeciwrakietowej, aby przeciwdziałać rosnącemu zagrożeniu pociskami ze strony Korei Północnej i Chin."
 MD2026_JAP_jsdf_expansion:0 "Rozbudowa JSDF"
 MD2026_JAP_jsdf_expansion_desc:0 "Rozbuduj Japońskie Siły Samoobrony o dodatkowy personel i jednostki, aby sprostać rosnącym wyzwaniom bezpieczeństwa w Azji Wschodniej."
 MD2026_JAP_integrated_air_defense:0 "Zintegrowana obrona przeciwlotnicza"
 MD2026_JAP_integrated_air_defense_desc:0 "Zbuduj wielowarstwową, zintegrowaną sieć obrony przeciwlotniczej i przeciwrakietowej, aby chronić japoński archipelag przed wszelkimi zagrożeniami."
 MD2026_JAP_quad_plus:0 "Format Quad Plus"
 MD2026_JAP_quad_plus_desc:0 "Rozszerz partnerstwo Quad poza czterech głównych członków, budując szerszą koalicję demokracji indo-pacyficznych."
 MD2026_JAP_maritime_supremacy:0 "Dominacja morska"
 MD2026_JAP_maritime_supremacy_desc:0 "Zainwestuj w japońską dominację morską na zachodnim Pacyfiku. Kontrola szlaków morskich jest niezbędna dla przetrwania narodu."
 MD2026_JAP_carrier_fleet:0 "Uderzeniowa flota lotniskowców"
 MD2026_JAP_carrier_fleet_desc:0 "Przebuduj lotniskowce typu Izumo do operacji z F-35B i zbuduj prawdziwe zdolności uderzeniowe lotniskowców dla JMSDF."
 MD2026_JAP_submarine_force:0 "Siły podwodne"
 MD2026_JAP_submarine_force_desc:0 "Rozbuduj zaawansowaną flotę okrętów podwodnych Japonii, aby utrzymać przewagę podwodną na spornych wodach wokół archipelagu."
 MD2026_JAP_pacific_guardian:0 "Strażnik Pacyfiku"
 MD2026_JAP_pacific_guardian_desc:0 "Rozmieść JMSDF jako strażnika pacyficznych szlaków morskich, zapewniając wolność żeglugi od Morza Wschodniochińskiego po Cieśninę Malakka."
 MD2026_JAP_island_defense:0 "Obrona łańcucha wysp"
 MD2026_JAP_island_defense_desc:0 "Umocnij pierwszy łańcuch wysp bateriami pocisków przeciwokrętowych i przeciwlotniczych, aby uniemożliwić przeciwnikowi dostęp do japońskich wód."
 MD2026_JAP_semiconductor_strategy:0 "Strategia półprzewodnikowa"
 MD2026_JAP_semiconductor_strategy_desc:0 "Odbuduj japoński przemysł półprzewodnikowy dzięki ogromnym inwestycjom w fabryki i zdolności projektowania układów."
 MD2026_JAP_ai_robotics:0 "SI i robotyka"
 MD2026_JAP_ai_robotics_desc:0 "Wykorzystaj japońską wiedzę w dziedzinie robotyki i inwestuj w sztuczną inteligencję, aby zrekompensować spadek demograficzny i zwiększyć produktywność."
 MD2026_JAP_supply_chain_resilience:0 "Odporność łańcuchów dostaw"
 MD2026_JAP_supply_chain_resilience_desc:0 "Zrestrukturyzuj łańcuchy dostaw, aby ograniczyć krytyczne zależności od Chin, przenosząc kluczową produkcję z powrotem do Japonii i państw sojuszniczych."
 MD2026_JAP_us_alliance:0 "Umocnienie sojuszu z USA"
 MD2026_JAP_us_alliance_desc:0 "Pogłęb sojusz USA–Japonia dzięki rozszerzonym umowom bazowym, wspólnym strukturom dowodzenia i wymianie technologii."
 MD2026_JAP_joint_operations:0 "Wspólne dowództwo operacyjne"
 MD2026_JAP_joint_operations_desc:0 "Ustanów wspólne dowództwo operacyjne z armią USA, aby umożliwić płynne operacje połączone w razie kryzysu na Pacyfiku."
 MD2026_JAP_intelligence_sharing:0 "Integracja z Five Eyes"
 MD2026_JAP_intelligence_sharing_desc:0 "Pogłęb wymianę informacji wywiadowczych z partnerami Five Eyes i sojusznikami regionalnymi, aby zbudować wszechstronną świadomość sytuacyjną w Indo-Pacyfiku."
 MD2026_JAP_cyber_defense:0 "Centrum obrony cybernetycznej"
 MD2026_JAP_cyber_defense_desc:0 "Ustanów narodowe centrum obrony cybernetycznej, aby chronić krytyczną infrastrukturę i sieci wojskowe przed atakami sponsorowanymi przez państwa."
 MD2026_JAP_okinawa_posture:0 "Postawa sił na Okinawie"
 MD2026_JAP_okinawa_posture_desc:0 "Zoptymalizuj rozmieszczenie sił na Okinawie i wyspach Nansei, wzmacniając wysuniętą obronę wobec chińskiej asertywności."
 MD2026_JAP_normal_nation:0 "Normalne państwo"
 MD2026_JAP_normal_nation_desc:0 "Japonia kończy transformację w normalne państwo — w pełni zdolne bronić siebie i swoich sojuszników w Indo-Pacyfiku."

 ### FOCUS TREES - TURKEY (TUR) ###
 MD2026_TUR_new_era:0 "Nowa era Turcji"
 MD2026_TUR_new_era_desc:0 "Pod przedłużonymi rządami Erdogana Turcja obiera coraz bardziej niezależny kurs między Wschodem a Zachodem."
 MD2026_TUR_defense_industry:0 "Lider przemysłu zbrojeniowego"
 MD2026_TUR_defense_industry_desc:0 "Turecki przemysł zbrojeniowy stał się znaczącym sukcesem eksportowym. Rozszerz produkcję krajową, aby ograniczyć zależność od zagranicy."
 MD2026_TUR_bayraktar:0 "Rewolucja Bayraktara"
 MD2026_TUR_bayraktar_desc:0 "Rozszerz tureckie zdolności w zakresie walki dronami. Bayraktar TB2 zmienił nowoczesną wojnę — teraz przoduj w kolejnej generacji."
 MD2026_TUR_tfx_fighter:0 "Myśliwiec TF-X KAAN"
 MD2026_TUR_tfx_fighter_desc:0 "Dokończ prace nad myśliwcem KAAN piątej generacji, aby uzyskać niezależność w zakresie przewagi w powietrzu."
 MD2026_TUR_mediation_power:0 "Mocarstwo mediacyjne"
 MD2026_TUR_mediation_power_desc:0 "Wykorzystaj wyjątkową pozycję Turcji między cywilizacjami, aby mediować w konfliktach międzynarodowych i rozszerzać wpływy."
 MD2026_TUR_syria_influence:0 "Wpływy w Syrii"
 MD2026_TUR_syria_influence_desc:0 "Rozszerz tureckie wpływy w powojennej Syrii, zarządzając kryzysem uchodźczym i zabezpieczając południową granicę."
 MD2026_TUR_central_corridor:0 "Korytarz centralny"
 MD2026_TUR_central_corridor_desc:0 "Zbuduj Korytarz Środkowy — szlak handlowy przez Kaukaz i Azję Centralną, omijający Rosję."
 MD2026_TUR_energy_hub:0 "Hub energetyczny"
 MD2026_TUR_energy_hub_desc:0 "Uczyń z Turcji kluczowy hub tranzytowy energii między producentami na Wschodzie a odbiorcami na Zachodzie."
 MD2026_TUR_defense_exports:0 "Eksport uzbrojenia"
 MD2026_TUR_defense_exports_desc:0 "Rozszerz kwitnący turecki eksport uzbrojenia, sprzedając drony Bayraktar, pojazdy opancerzone i okręty wojenne odbiorcom na całym świecie."
 MD2026_TUR_naval_program:0 "Budownictwo okrętowe"
 MD2026_TUR_naval_program_desc:0 "Uruchom ambitny program budowy okrętów z rodzimymi fregatami, korwetami i okrętami desantowymi."
 MD2026_TUR_nato_loyalty:0 "Lojalność wobec NATO"
 MD2026_TUR_nato_loyalty_desc:0 "Odnow zobowiązania wobec NATO i wzmocnij więzi z Waszyngtonem i Londynem, pozycjonując Turcję jako niezbędną wschodnią kotwicę sojuszu."
 MD2026_TUR_eurasian_pivot:0 "Zwrot euroazjatycki"
 MD2026_TUR_eurasian_pivot_desc:0 "Zwróć się ku Rosji i Chinom, budując partnerstwa strategiczne wykorzystujące pozycję Turcji między Wschodem a Zachodem."
 MD2026_TUR_regional_hegemon:0 "Hegemon regionalny"
 MD2026_TUR_regional_hegemon_desc:0 "Zapewnij Turcji pozycję dominującej potęgi regionalnej, rzutując wpływy militarne i dyplomatyczne na Bliski Wschód i Azję Centralną."
 MD2026_TUR_dual_seas:0 "Strategia dwóch mórz"
 MD2026_TUR_dual_seas_desc:0 "Opracuj strategię morską dla jednoczesnych operacji na Morzu Czarnym i we wschodniej części Morza Śródziemnego."
 MD2026_TUR_black_sea_control:0 "Kontrola Morza Czarnego"
 MD2026_TUR_black_sea_control_desc:0 "Wzmocnij turecką obecność morską i zdolności nadzoru na Morzu Czarnym, aby zapewnić kontrolę nad tym strategicznym akwenem."
 MD2026_TUR_east_med:0 "Obecność na wschodnim Morzu Śródziemnym"
 MD2026_TUR_east_med_desc:0 "Rozszerz turecką obecność wojskową we wschodniej części Morza Śródziemnego, chroniąc roszczenia morskie i interesy energetyczne."
 MD2026_TUR_straits_leverage:0 "Atut cieśnin"
 MD2026_TUR_straits_leverage_desc:0 "Wykorzystaj kontrolę Turcji nad cieśninami Bosfor i Dardanele jako narzędzie strategiczne w dyplomacji międzynarodowej."
 MD2026_TUR_libya_influence:0 "Wpływy w Libii"
 MD2026_TUR_libya_influence_desc:0 "Utrwal tureckie wpływy w Libii poprzez współpracę wojskową, więzi gospodarcze i wsparcie polityczne."
 MD2026_TUR_turkic_council:0 "Rada Państw Turkijskich"
 MD2026_TUR_turkic_council_desc:0 "Wzmocnij Organizację Państw Turkijskich, budując blok narodów tureckojęzycznych pod przywództwem Turcji."
 MD2026_TUR_middle_corridor:0 "Korytarz środkowy"
 MD2026_TUR_middle_corridor_desc:0 "Rozwiń transkaspijski Korytarz Środkowy — szlak handlowy łączący Turcję z Azją Centralną i Chinami, omijający Rosję."
 MD2026_TUR_economic_stabilization:0 "Stabilizacja gospodarcza"
 MD2026_TUR_economic_stabilization_desc:0 "Ustabilizuj nadszarpniętą turecką gospodarkę ortodoksyjną polityką monetarną, przyciągając zagraniczne inwestycje i przywracając wzrost."
 MD2026_TUR_safe_zone:0 "Strefa bezpieczeństwa w Syrii"
 MD2026_TUR_safe_zone_desc:0 "Utrzymuj i rozszerzaj kontrolowaną przez Turcję strefę bezpieczeństwa w północnej Syrii, zabezpieczając granicę przed zagrożeniami kurdyjskimi i dżihadystycznymi."
 MD2026_TUR_refugee_return:0 "Program powrotu uchodźców"
 MD2026_TUR_refugee_return_desc:0 "Ułatw powrót syryjskich uchodźców poprzez rozwój strefy bezpieczeństwa i projekty odbudowy w północnej Syrii."
 MD2026_TUR_infrastructure_projects:0 "Projekty infrastrukturalne"
 MD2026_TUR_infrastructure_projects_desc:0 "Buduj drogi, mieszkania i infrastrukturę komunalną w syryjskiej strefie bezpieczeństwa, tworząc warunki dla stabilności i osiedlania uchodźców."
 MD2026_TUR_cultural_influence:0 "Wpływy kulturowe"
 MD2026_TUR_cultural_influence_desc:0 "Rzutuj turecką soft power poprzez media, edukację i instytucje kultury w całej dawnej strefie osmańskiej."
 MD2026_TUR_century_of_turkiye:0 "Stulecie Türkiye"
 MD2026_TUR_century_of_turkiye_desc:0 "Turcja wyłania się jako mocarstwo samo w sobie — pomost między cywilizacjami, pan cieśnin i przywódca świata turkijskiego."

 ### FOCUS TREES - BRAZIL (BRA) ###
 MD2026_BRA_return:0 "Powrót Brazylii"
 MD2026_BRA_return_desc:0 "Pod przywództwem Luli Brazylia na nowo angażuje się w stosunki międzynarodowe i umacnia swoją rolę lidera regionalnego."
 MD2026_BRA_amazon_protection:0 "Ochrona Amazonii"
 MD2026_BRA_amazon_protection_desc:0 "Odwróć proces wylesiania i chroń las amazoński — płuca planety."
 MD2026_BRA_green_economy:0 "Zielona gospodarka"
 MD2026_BRA_green_economy_desc:0 "Inwestuj w zrównoważony rozwój i energię odnawialną, aby zbudować zieloną potęgę gospodarczą."
 MD2026_BRA_reindustrialization:0 "Reindustrializacja"
 MD2026_BRA_reindustrialization_desc:0 "Odbuduj bazę przemysłową Brazylii dzięki ukierunkowanym inwestycjom i substytucji importu."
 MD2026_BRA_sa_trade:0 "Handel w Ameryce Południowej"
 MD2026_BRA_sa_trade_desc:0 "Wzmocnij więzi handlowe w całej Ameryce Południowej, aby zbudować jednolity blok gospodarczy."
 MD2026_BRA_agri_superpower:0 "Mocarstwo rolne"
 MD2026_BRA_agri_superpower_desc:0 "Wykorzystaj pozycję Brazylii jako największego eksportera żywności na świecie, aby rozszerzyć globalne wpływy."
 MD2026_BRA_brics_leadership:0 "Przywództwo w BRICS+"
 MD2026_BRA_brics_leadership_desc:0 "Przejmij wiodącą rolę w BRICS+, aby przekształcić globalną architekturę finansową."
 MD2026_BRA_un_reform:0 "Reforma Rady Bezpieczeństwa ONZ"
 MD2026_BRA_un_reform_desc:0 "Naciskaj na reformę Rady Bezpieczeństwa ONZ, aby Brazylia otrzymała stałe miejsce, odzwierciedlając realia XXI wieku."
 MD2026_BRA_mercosur:0 "Odrodzenie Mercosuru"
 MD2026_BRA_mercosur_desc:0 "Ożyw Mercosur jako funkcjonujący blok handlowy i przeciwwagę dla amerykańskich wpływów gospodarczych."
 MD2026_BRA_military_modernization:0 "Modernizacja sił zbrojnych"
 MD2026_BRA_military_modernization_desc:0 "Zmodernizuj brazylijskie siły zbrojne przez nowy sprzęt i doktrynę, aby rzutować potęgę regionalną."

 ### FOCUS TREES - ISRAEL (ISR) ###
 MD2026_ISR_iron_wall:0 "Żelazny mur"
 MD2026_ISR_iron_wall_desc:0 "W następstwie 7 października i wojny w Gazie Izrael umacnia swoją obronę i przekształca postawę strategiczną."
 MD2026_ISR_gaza_aftermath:0 "Pokłosie Gazy"
 MD2026_ISR_gaza_aftermath_desc:0 "Zarządzaj następstwami konfliktu w Gazie — uzgodnieniami bezpieczeństwa, kwestiami humanitarnymi i konsekwencjami politycznymi."
 MD2026_ISR_northern_front:0 "Front północny"
 MD2026_ISR_northern_front_desc:0 "Rozwiąż problem zagrożenia ze strony Hezbollahu na północnej granicy po konflikcie w Libanie w 2024 roku."
 MD2026_ISR_iran_threat:0 "Zagrożenie irańskie"
 MD2026_ISR_iran_threat_desc:0 "Staw czoła egzystencjalnemu zagrożeniu ze strony irańskiego programu jądrowego i regionalnej sieci proxy."
 MD2026_ISR_preemptive_strike:0 "Opcja uderzenia wyprzedzającego"
 MD2026_ISR_preemptive_strike_desc:0 "Przygotuj opcje wojskowe dla uderzenia wyprzedzającego na irańskie obiekty jądrowe."
 MD2026_ISR_covert_ops:0 "Operacje tajne"
 MD2026_ISR_covert_ops_desc:0 "Rozszerz tajne operacje Mossadu wymierzone w irański program jądrowy i regionalnych pełnomocników."
 MD2026_ISR_abraham_accords:0 "Rozszerzenie Porozumień Abrahamowych"
 MD2026_ISR_abraham_accords_desc:0 "Rozszerz Porozumienia Abrahamowe, normalizując stosunki z kolejnymi państwami arabskimi i muzułmańskimi."
 MD2026_ISR_saudi_deal:0 "Normalizacja z Arabią Saudyjską"
 MD2026_ISR_saudi_deal_desc:0 "Dąż do historycznej nagrody — normalizacji stosunków z Arabią Saudyjską, strażniczką najświętszych miejsc islamu."
 MD2026_ISR_defense_tech:0 "Innowacje w technologiach obronnych"
 MD2026_ISR_defense_tech_desc:0 "Inwestuj w modernizację Iron Dome, laserową obronę Iron Beam i wojskową SI nowej generacji."
 MD2026_ISR_border_defense:0 "Reorganizacja obrony granic"
 MD2026_ISR_border_defense_desc:0 "Zreformuj infrastrukturę ochrony granic Izraela dzięki zaawansowanym czujnikom, barierom i siłom szybkiego reagowania po klęskach z 7 października."
 MD2026_ISR_iron_dome_upgrade:0 "Modernizacja Iron Dome"
 MD2026_ISR_iron_dome_upgrade_desc:0 "Zmodernizuj system Iron Dome, aby przeciwdziałać ewoluującym zagrożeniom rakietowym i pociskowym z wielu kierunków jednocześnie."
 MD2026_ISR_idf_restructuring:0 "Restrukturyzacja IDF"
 MD2026_ISR_idf_restructuring_desc:0 "Zrestrukturyzuj Siły Obronne Izraela, zwiększając stan osobowy i usprawniając dowodzenie, aby sprostać wymaganiom operacyjnym na wielu frontach."
 MD2026_ISR_nuclear_deterrent:0 "Odstraszanie jądrowe"
 MD2026_ISR_nuclear_deterrent_desc:0 "Wzmocnij niejednoznaczny potencjał odstraszania jądrowego Izraela zaawansowanymi systemami przenoszenia, aby żaden przeciwnik się nie przeliczył."
 MD2026_ISR_mossad_shin_bet:0 "Mossad i Shin Bet"
 MD2026_ISR_mossad_shin_bet_desc:0 "Rozbuduj izraelskie agencje wywiadowcze o dodatkowe zasoby i zdolności, aby zapobiegać strategicznym zaskoczeniom."
 MD2026_ISR_regional_intelligence:0 "Regionalna sieć wywiadowcza"
 MD2026_ISR_regional_intelligence_desc:0 "Zbuduj regionalną sieć wymiany informacji wywiadowczych z partnerami Porozumień Abrahamowych, aby przeciwdziałać wspólnym zagrożeniom."
 MD2026_ISR_signals_intelligence:0 "Wywiad sygnałowy"
 MD2026_ISR_signals_intelligence_desc:0 "Inwestuj w zaawansowany wywiad sygnałowy i zdolności walki elektronicznej, aby utrzymać izraelską przewagę technologiczną."
 MD2026_ISR_counter_terrorism:0 "Operacje antyterrorystyczne"
 MD2026_ISR_counter_terrorism_desc:0 "Rozszerz operacje specjalne i zdolności antyterrorystyczne we wszystkich teatrach działań."
 MD2026_ISR_cyber_warfare:0 "Wojna cybernetyczna"
 MD2026_ISR_cyber_warfare_desc:0 "Rozwijaj ofensywne i defensywne zdolności wojny cybernetycznej, wykorzystując światowej klasy sektor technologiczny Izraela."
 MD2026_ISR_gulf_integration:0 "Integracja gospodarcza z Zatoką"
 MD2026_ISR_gulf_integration_desc:0 "Pogłęb integrację gospodarczą z państwami Zatoki, tworząc korytarze handlowe i wspólne przedsięwzięcia przemysłowe."
 MD2026_ISR_regional_trade:0 "Regionalna sieć handlowa"
 MD2026_ISR_regional_trade_desc:0 "Rozszerz sieci handlowe na całym Bliskim Wschodzie, przekształcając porozumienia normalizacyjne w realne partnerstwa gospodarcze."
 MD2026_ISR_water_diplomacy:0 "Dyplomacja wodna"
 MD2026_ISR_water_diplomacy_desc:0 "Wykorzystaj izraelską wiedzę w zakresie odsalania i technologii wodnych jako narzędzie dyplomatyczne do budowania relacji w całym suchym regionie."
 MD2026_ISR_iron_beam:0 "Laser Iron Beam"
 MD2026_ISR_iron_beam_desc:0 "Rozmieszczaj laserowy system obronny Iron Beam, rewolucjonizując obronę przeciwrakietową niemal zerowym kosztem przechwycenia."
 MD2026_ISR_uav_dominance:0 "Dominacja dronów"
 MD2026_ISR_uav_dominance_desc:0 "Utrzymaj światowe przewodnictwo Izraela w systemach bezzałogowych, rozwijając drony nowej generacji do rozpoznania i uderzeń."
 MD2026_ISR_ai_warfare:0 "Systemy bojowe SI"
 MD2026_ISR_ai_warfare_desc:0 "Zintegruj sztuczną inteligencję z wojskowymi systemami naprowadzania, logistyki i dowodzenia, aby utrzymać przewagę na polu walki."
 MD2026_ISR_space_program:0 "Program kosmiczny"
 MD2026_ISR_space_program_desc:0 "Rozszerz zdolności kosmiczne Izraela o zaawansowane satelity rozpoznawcze i systemy wczesnego ostrzegania o pociskach."
 MD2026_ISR_startup_nation:0 "Start-Up Nation u szczytu"
 MD2026_ISR_startup_nation_desc:0 "Izrael osiąga szczyt innowacyjności i bezpieczeństwa — mocarstwo technologiczne ważące znacznie więcej, niż wskazywałaby jego wielkość."

 ### FOCUS TREES - SOUTH KOREA (KOR) ###
 MD2026_KOR_shield_freedom:0 "Tarcza wolności"
 MD2026_KOR_shield_freedom_desc:0 "Korea Południowa wzmacnia swoją obronę i globalną rolę w erze bezprecedensowych zagrożeń ze strony Północy."
 MD2026_KOR_nk_deterrence:0 "Odstraszanie Korei Północnej"
 MD2026_KOR_nk_deterrence_desc:0 "Wzmocnij zdolności odstraszania wobec rosnącego północnokoreańskiego arsenału jądrowego i rakietowego."
 MD2026_KOR_kill_chain:0 "Koreański Kill Chain"
 MD2026_KOR_kill_chain_desc:0 "Dokończ trójosiowy system obrony: wyprzedzające uderzenie Kill Chain, obronę przeciwrakietową KAMD i odwet KMPR."
 MD2026_KOR_diplomatic_opening:0 "Otwarcie dyplomatyczne"
 MD2026_KOR_diplomatic_opening_desc:0 "Zbadaj kanały dyplomatyczne z Pjongjangiem, aby złagodzić napięcia na półwyspie."
 MD2026_KOR_k_defense:0 "Eksport K-Defense"
 MD2026_KOR_k_defense_desc:0 "Rozszerz kwitnący eksport uzbrojenia Korei Południowej — od czołgów K2, przez haubice K9, po myśliwce FA-50."
 MD2026_KOR_k_economy:0 "K-Gospodarka"
 MD2026_KOR_k_economy_desc:0 "Wykorzystaj mocne strony gospodarki Korei Południowej — półprzewodniki, przemysł stoczniowy, K-kulturę — dla przewagi strategicznej."
 MD2026_KOR_cultural_export:0 "Eksport K-Kultury"
 MD2026_KOR_cultural_export_desc:0 "Wykorzystaj miękką siłę kulturową Korei — K-pop, K-dramy, koreańską kuchnię — do budowania globalnych wpływów."
 MD2026_KOR_us_alliance:0 "Wzmocnienie sojuszu z USA"
 MD2026_KOR_us_alliance_desc:0 "Pogłęb sojusz USA–Korea Południowa dzięki rozszerzonej współpracy wojskowej i wymianie technologii."
 MD2026_KOR_missile_shield:0 "Tarcza przeciwrakietowa"
 MD2026_KOR_missile_shield_desc:0 "Rozmieszczaj wielowarstwową tarczę przeciwrakietową, aby chronić Koreę Południową przed północnokoreańskimi pociskami balistycznymi."
 MD2026_KOR_dmz_fortification:0 "Umocnienie strefy zdemilitaryzowanej"
 MD2026_KOR_dmz_fortification_desc:0 "Wzmocnij umocnienia wzdłuż strefy zdemilitaryzowanej zaawansowanymi czujnikami, przeszkodami i siłami szybkiego reagowania."
 MD2026_KOR_preemptive_capability:0 "Zdolność uderzenia wyprzedzającego"
 MD2026_KOR_preemptive_capability_desc:0 "Rozwijaj zdolności precyzyjnego rażenia, aby neutralizować północnokoreańskie wyrzutnie pocisków, zanim zdążą wystrzelić."
 MD2026_KOR_peninsular_strategy:0 "Strategia półwyspu"
 MD2026_KOR_peninsular_strategy_desc:0 "Opracuj kompleksową strategię dla Półwyspu Koreańskiego, równoważącą odstraszanie, dyplomację i planowanie zjednoczenia."
 MD2026_KOR_maximum_pressure:0 "Maksymalna presja"
 MD2026_KOR_maximum_pressure_desc:0 "Wywieraj maksymalną presję gospodarczą i dyplomatyczną na Koreę Północną, wzmacniając jednocześnie sojusz USA–Korea Południowa."
 MD2026_KOR_unification_preparation:0 "Przygotowania do zjednoczenia"
 MD2026_KOR_unification_preparation_desc:0 "Rozpocznij długoterminowe przygotowania do zjednoczenia Korei — od planowania gospodarczego po ramy zarządzania."
 MD2026_KOR_kf21_boramae:0 "KF-21 Boramae"
 MD2026_KOR_kf21_boramae_desc:0 "Dokończ produkcję seryjną myśliwca KF-21 Boramae i osiągnij niezależność w zakresie przewagi w powietrzu od zagranicznych dostawców."
 MD2026_KOR_k2_panther:0 "K2 Black Panther"
 MD2026_KOR_k2_panther_desc:0 "Rozszerz produkcję czołgu podstawowego K2 Black Panther, stanowiącego trzon koreańskich wojsk pancernych."
 MD2026_KOR_defense_exports:0 "Boom eksportowy uzbrojenia"
 MD2026_KOR_defense_exports_desc:0 "Wykorzystaj globalny popyt na koreańskie systemy uzbrojenia, rozszerzając eksport zbrojeniowy do sojuszników na całym świecie."
 MD2026_KOR_naval_expansion:0 "Rozbudowa marynarki"
 MD2026_KOR_naval_expansion_desc:0 "Rozbuduj Marynarkę Wojenną Republiki Korei o nowe niszczyciele, okręty podwodne i okręty desantowe, aby zabezpieczyć interesy morskie."
 MD2026_KOR_semiconductor_hub:0 "Globalne centrum półprzewodników"
 MD2026_KOR_semiconductor_hub_desc:0 "Umocnij pozycję Korei Południowej jako światowej stolicy półprzewodników dzięki ogromnym inwestycjom w produkcję układów nowej generacji."
 MD2026_KOR_ai_innovation:0 "Innowacje w SI"
 MD2026_KOR_ai_innovation_desc:0 "Inwestuj w badania i zastosowania sztucznej inteligencji, od systemów wojskowych po automatyzację przemysłu."
 MD2026_KOR_green_economy:0 "Przejście na zieloną gospodarkę"
 MD2026_KOR_green_economy_desc:0 "Przejdź na zieloną gospodarkę dzięki inwestycjom w energię odnawialną i zrównoważonym praktykom przemysłowym."
 MD2026_KOR_combined_forces:0 "Dowództwo Sił Połączonych"
 MD2026_KOR_combined_forces_desc:0 "Wzmocnij Dowództwo Sił Połączonych USA–Korea Południowa dzięki rozszerzonym wspólnym ćwiczeniom i zintegrowanym operacjom."
 MD2026_KOR_indo_pacific_partner:0 "Partner indo-pacyficzny"
 MD2026_KOR_indo_pacific_partner_desc:0 "Rozszerz rolę Korei Południowej jako kluczowego partnera Indo-Pacyfiku, budując więzi strategiczne z Australią i Indiami."
 MD2026_KOR_japan_cooperation:0 "Współpraca z Japonią"
 MD2026_KOR_japan_cooperation_desc:0 "Przezwycięż historyczne urazy, aby zbudować praktyczną współpracę bezpieczeństwa z Japonią przeciw wspólnym zagrożeniom."
 MD2026_KOR_asean_engagement:0 "Zaangażowanie w ASEAN"
 MD2026_KOR_asean_engagement_desc:0 "Pogłęb zaangażowanie wobec państw ASEAN poprzez handel, pomoc rozwojową i partnerstwa bezpieczeństwa."
 MD2026_KOR_global_pivot_state:0 "Globalne państwo osiowe"
 MD2026_KOR_global_pivot_state_desc:0 "Korea Południowa wyłania się jako globalne państwo osiowe — demokratyczna, technologiczna i wojskowa potęga łącząca regiony."

 ### FOCUS TREES - SAUDI ARABIA (SAU) ###
 MD2026_SAU_vision_2030:0 "Wizja 2030"
 MD2026_SAU_vision_2030_desc:0 "Ambitny plan księcia koronnego Mohammeda bin Salmana, by przekształcić Arabię Saudyjską i uwolnić ją od zależności od ropy."
 MD2026_SAU_diversification:0 "Dywersyfikacja gospodarcza"
 MD2026_SAU_diversification_desc:0 "Zdywersyfikuj saudyjską gospodarkę poza ropę dzięki ogromnym inwestycjom w turystykę, technologię i rozrywkę."
 MD2026_SAU_neom:0 "Megaprojekt NEOM"
 MD2026_SAU_neom_desc:0 "Zbuduj megamiasto NEOM za 500 miliardów dolarów — wizytówkę saudyjskich ambicji i innowacji technologicznych."
 MD2026_SAU_tourism:0 "Rewolucja turystyczna"
 MD2026_SAU_tourism_desc:0 "Otwórz Arabię Saudyjską na turystykę międzynarodową — od kurortów nad Morzem Czerwonym po zabytki Dirijjah."
 MD2026_SAU_oil_strategy:0 "Strategia naftowa"
 MD2026_SAU_oil_strategy_desc:0 "Zarządzaj pozycją Arabii Saudyjskiej jako regulatora podaży w OPEC w świecie odchodzącym od paliw kopalnych."
 MD2026_SAU_opec_dominance:0 "Dominacja w OPEC+"
 MD2026_SAU_opec_dominance_desc:0 "Utrzymaj saudyjską dominację nad decyzjami produkcyjnymi OPEC+ i globalnymi cenami ropy."
 MD2026_SAU_green_hydrogen:0 "Pionier zielonego wodoru"
 MD2026_SAU_green_hydrogen_desc:0 "Inwestuj w produkcję zielonego wodoru, aby pozycjonować Arabię Saudyjską jako lidera energii w erze ponaftowej."
 MD2026_SAU_regional_balance:0 "Równowaga regionalna"
 MD2026_SAU_regional_balance_desc:0 "Poruszaj się w zawiłej sieci bliskowschodnich sojuszy i rywalizacji z pozycji siły."
 MD2026_SAU_iran_rivalry:0 "Rywalizacja z Iranem"
 MD2026_SAU_iran_rivalry_desc:0 "Zarządzaj saudyjsko-irańską rywalizacją mimo zbliżenia za chińskim pośrednictwem."
 MD2026_SAU_abraham_accords:0 "Ścieżka Porozumień Abrahamowych"
 MD2026_SAU_abraham_accords_desc:0 "Zbadaj możliwość normalizacji stosunków z Izraelem — umowy, która mogłaby przekształcić cały Bliski Wschód."
 MD2026_SAU_military_modernization:0 "Modernizacja armii"
