 MD2026_ITA_economic_reform:0 "Reforma gospodarcza"
 MD2026_ITA_economic_reform_desc:0 "Rozwiąż chroniczne problemy gospodarcze Włoch poprzez reformy strukturalne i inwestycje."
 MD2026_ITA_south_development:0 "Rozwój południa"
 MD2026_ITA_south_development_desc:0 "Inwestuj w słabo rozwinięte południe Włoch dzięki unijnym funduszom odbudowy i programom celowym."
 MD2026_ITA_northern_industry:0 "Przemysł północy"
