 MD2026_ITA_debt_management:0 "Zarządzanie długiem"
 MD2026_ITA_debt_management_desc:0 "Opanuj ogromny dług publiczny Włoch poprzez dyscyplinę fiskalną i politykę nastawioną na wzrost."
 MD2026_ITA_migration_crisis:0 "Kryzys migracyjny"
 MD2026_ITA_migration_crisis_desc:0 "Staw czoła trwającemu kryzysowi migracyjnemu na granicach Włoch, kluczowej kwestii politycznej."
 MD2026_ITA_fortress_europe:0 "Twierdza Europa"
 MD2026_ITA_fortress_europe_desc:0 "Dąż do zaostrzenia kontroli granic UE i umów z państwami Afryki Północnej, by powstrzymać migrację."
 MD2026_ITA_integration_plan:0 "Plan integracji"
 MD2026_ITA_integration_plan_desc:0 "Opracuj kompleksowy plan integracji migrantów, aby zaradzić niedoborom siły roboczej."
 MD2026_ITA_mediterranean_patrol:0 "Patrole śródziemnomorskie"
 MD2026_ITA_mediterranean_patrol_desc:0 "Rozmieść patrole morskie na środkowym Morzu Śródziemnym, aby kontrolować przepływy migracyjne."
 MD2026_ITA_labor_migration:0 "Migracja zarobkowa"
 MD2026_ITA_labor_migration_desc:0 "Utwórz legalne kanały migracji zarobkowej, aby uzupełnić luki we włoskiej sile roboczej."
 MD2026_ITA_piano_mattei:0 "Plan Matteiego"
 MD2026_ITA_piano_mattei_desc:0 "Wdróż plan Matteiego zakładający włoskie partnerstwo z państwami Afryki w dziedzinie energii i rozwoju."
 MD2026_ITA_energy_corridors:0 "Korytarze energetyczne"
 MD2026_ITA_energy_corridors_desc:0 "Rozwijaj korytarze energetyczne z Afryki Północnej i wschodniego Morza Śródziemnego do Europy przez Włochy."
 MD2026_ITA_libya_stabilization:0 "Stabilizacja Libii"
 MD2026_ITA_libya_stabilization_desc:0 "Wspieraj wysiłki stabilizacyjne w Libii, aby zabezpieczyć dostawy energii i ograniczyć migrację."
 MD2026_ITA_gas_hub:0 "Hub gazowy"
 MD2026_ITA_gas_hub_desc:0 "Przekształć Włochy w południowy hub gazowy Europy, importujący gaz z Algierii, Libii i wschodniego Morza Śródziemnego."
 MD2026_ITA_african_partnerships:0 "Partnerstwa afrykańskie"
 MD2026_ITA_african_partnerships_desc:0 "Rozszerz włoskie partnerstwa gospodarcze w całej Afryce w ramach planu Matteiego."
 MD2026_ITA_eu_leadership:0 "Przywództwo w UE"
 MD2026_ITA_eu_leadership_desc:0 "Zwiększ głos Włoch w procesie decyzyjnym UE jako trzeciej gospodarki wspólnoty."
 MD2026_ITA_eurozone_reform:0 "Reforma strefy euro"
 MD2026_ITA_eurozone_reform_desc:0 "Dąż do reformy strefy euro, aby złagodzić ograniczenia fiskalne dla zadłużonych państw członkowskich."
 MD2026_ITA_cultural_heritage:0 "Dziedzictwo kulturowe"
 MD2026_ITA_cultural_heritage_desc:0 "Wykorzystaj niezrównane dziedzictwo kulturowe Włoch jako miękką siłę i atut gospodarczy."
 MD2026_ITA_fiscal_stability:0 "Stabilność fiskalna"
 MD2026_ITA_fiscal_stability_desc:0 "Wykaż odpowiedzialność fiskalną, aby uspokoić rynki i europejskich partnerów."
 MD2026_ITA_tourism_economy:0 "Gospodarka turystyczna"
 MD2026_ITA_tourism_economy_desc:0 "Rozwijaj włoski sektor turystyczny jako ważny motor wzrostu gospodarczego i zatrudnienia."
 MD2026_ITA_italian_renaissance:0 "Włoski renesans"
 MD2026_ITA_italian_renaissance_desc:0 "Włochy przeżywają renesans — potęga śródziemnomorska, hub energetyczny i lider Europy."

