 md2026_iran_nuclear_deal_desc:0 "Dąż do nowego porozumienia jądrowego z Iranem, oferując złagodzenie sankcji w zamian za ograniczenia programu jądrowego. Izrael i Arabia Saudyjska zdecydowanie to potępią."
 md2026_counter_sanctions:0 "Odpowiedź kontrsankcjami"
 md2026_counter_sanctions_desc:0 "Nałóż odwetowe sankcje na państwa zachodnie. To sygnał sprzeciwu, ale może jeszcze bardziej izolować Rosję gospodarczo."

 ### NATO DECISIONS ###
 md2026_increase_defense_spending:0 "Zwiększ wydatki na obronę"
 md2026_increase_defense_spending_desc:0 "Zobowiąż się do podniesienia wydatków na obronę do celu NATO wynoszącego 2% PKB. Poprawi to gotowość wojskową, ale będzie kosztować kapitał polityczny."
 md2026_deploy_nato_battlegroup:0 "Rozmieść grupę bojową NATO na wschodzie"
 md2026_deploy_nato_battlegroup_desc:0 "Rozmieść wielonarodową grupę bojową na wschodniej flance NATO jako środek odstraszający przed rosyjską agresją. Wschodni sojusznicy otrzymają bonusy obronne."
 md2026_nato_joint_exercises:0 "Przeprowadź wspólne ćwiczenia"
 md2026_nato_joint_exercises_desc:0 "Organizuj i bierz udział we wspólnych ćwiczeniach wojskowych NATO, aby poprawić interoperacyjność i gotowość państw sojuszu."
 md2026_request_nato_consultation:0 "Zwróć się o konsultacje NATO"
 md2026_request_nato_consultation_desc:0 "Powołaj się na artykuł 4 traktatu NATO, zwracając się o konsultacje z sojusznikami w sprawie domniemanego zagrożenia bezpieczeństwa."

 ### GEOPOLITICS DECISIONS ###
 md2026_apply_brics_membership:0 "Złóż wniosek o członkostwo w BRICS+"
 md2026_apply_brics_membership_desc:0 "Złóż wniosek o przystąpienie do rozszerzonego bloku BRICS+, zacieśniając więzi gospodarcze z Chinami, Rosją, Indiami i Brazylią jako alternatywą dla instytucji pod przewodnictwem Zachodu."
 md2026_escalate_trade_war:0 "Eskaluj wojnę handlową z Chinami"
 md2026_escalate_trade_war_desc:0 "Nałóż dodatkowe cła na chińskie towary, aby chronić krajowy przemysł. Chiny odpowiedzą cłami odwetowymi, co odbije się na obu gospodarkach."
 md2026_recognize_taiwan:0 "Uznaj Tajwan dyplomatycznie"
 md2026_recognize_taiwan_desc:0 "Uznaj formalnie Tajwan za niepodległe państwo. Rozwścieczy to Chiny, ale wzmocni relacje z Tajpej."
 md2026_military_aid_ukraine:0 "Wyślij pomoc wojskową Ukrainie"
 md2026_military_aid_ukraine_desc:0 "Dostarcz Ukrainie sprzęt i zaopatrzenie wojskowe w jej trwającym konflikcie z Rosją. Rosja uzna to za wrogi akt."
 md2026_propose_ceasefire:0 "Zaproponuj zawieszenie broni między Rosją a Ukrainą"
 md2026_propose_ceasefire_desc:0 "Wykorzystaj wpływy dyplomatyczne, aby zaproponować zawieszenie broni między Rosją a Ukrainą. Wynik zależy od układu sił i woli obu stron."

 ### MILITARY MODERNIZATION DECISIONS ###
 md2026_procure_drones:0 "Pozyskaj systemy bojowych dronów"
 md2026_procure_drones_desc:0 "Zainwestuj w nowoczesne bezzałogowe aparaty bojowe (UCAV) i taktyczne systemy dronów, które okazały się rozstrzygające w ostatnich konfliktach."
 md2026_cyber_warfare_program:0 "Utwórz Dowództwo Wojny Cybernetycznej"
 md2026_cyber_warfare_program_desc:0 "Stwórz wyspecjalizowane zdolności wojny cybernetycznej do działań ofensywnych i defensywnych w domenie cyfrowej."
 md2026_military_ai_development:0 "Wojskowy program badań nad SI"
 md2026_military_ai_development_desc:0 "Uruchom dedykowany program integracji sztucznej inteligencji z planowaniem wojskowym, logistyką i autonomicznymi systemami uzbrojenia."
 md2026_expand_special_forces:0 "Rozbuduj siły operacji specjalnych"
 md2026_expand_special_forces_desc:0 "Zwiększ liczebność i zdolności sił operacji specjalnych do walki z terroryzmem, rozpoznania i działań niekonwencjonalnych."
 md2026_fortify_borders:0 "Umocnij regiony przygraniczne"
 md2026_fortify_borders_desc:0 "Zbuduj umocnienia obronne wzdłuż granic zagrożonych potencjalnymi niebezpieczeństwami, poprawiając zdolności obrony terytorium."

 ### ECONOMIC DECISIONS ###
 md2026_energy_independence:0 "Program niezależności energetycznej"
 md2026_energy_independence_desc:0 "Uruchom kompleksowy program ograniczania zależności od importowanej energii poprzez inwestycje w OZE, energetykę jądrową i produkcję krajową."
 md2026_infrastructure_investment:0 "Krajowe inwestycje w infrastrukturę"
 md2026_infrastructure_investment_desc:0 "Inwestuj w modernizację krajowej infrastruktury, w tym transportu, łączności i sieci komunalnych."
 md2026_digital_economy:0 "Inicjatywa gospodarki cyfrowej"
 md2026_digital_economy_desc:0 "Uruchom krajowy program transformacji cyfrowej, aby zmodernizować gospodarkę dzięki technologii, SI i usługom cyfrowym."
 md2026_arms_export_program:0 "Program eksportu broni"
 md2026_arms_export_program_desc:0 "Ustanów krajowy program eksportu broni, aby generować dochody i zwiększać wpływy geopolityczne poprzez sprzedaż uzbrojenia."
 md2026_anti_corruption:0 "Kampania antykorupcyjna"
 md2026_anti_corruption_desc:0 "Uruchom krajową kampanię antykorupcyjną, aby poprawić jakość rządzenia, przyciągnąć inwestycje zagraniczne i zwiększyć zaufanie społeczne."

 ### DECISION REWARD IDEAS ###
 md2026_additional_sanctions_effect:0 "Dodatkowe sankcje"
 md2026_additional_sanctions_effect_desc:0 "Dodatkowe sankcje gospodarcze szkodzą produkcji przemysłowej i handlowi."
 md2026_increased_defense_budget:0 "Zwiększony budżet obronny"
 md2026_increased_defense_budget_desc:0 "Wyższe wydatki na obronę umożliwiają modernizację i rozbudowę armii."
 md2026_nato_battlegroup_deployed:0 "Rozmieszczona grupa bojowa NATO"
 md2026_nato_battlegroup_deployed_desc:0 "W kraju stacjonuje wielonarodowa grupa bojowa NATO, wzmacniając obronę."
 md2026_trade_war_tariffs:0 "Cła wojny handlowej"
 md2026_trade_war_tariffs_desc:0 "Odwetowe cła zakłócają handel i podnoszą koszty dóbr konsumpcyjnych."
 md2026_trade_war_tariffs_usa:0 "Cła ochronne"
 md2026_trade_war_tariffs_usa_desc:0 "Cła na zagraniczny import chronią krajowy przemysł, ale podnoszą ceny dla konsumentów."
 md2026_drone_warfare_capability:0 "Zdolność walki dronami"
 md2026_drone_warfare_capability_desc:0 "Nowoczesne bojowe systemy dronów dają przewagę taktyczną na polu walki."
 md2026_cyber_capability:0 "Zdolność wojny cybernetycznej"
 md2026_cyber_capability_desc:0 "Zaawansowane zdolności wojny cybernetycznej zapewniają przewagę wywiadowczą i możliwości obronne."
 md2026_military_ai_systems:0 "Wojskowe systemy SI"
 md2026_military_ai_systems_desc:0 "Systemy wojskowe oparte na SI poprawiają planowanie, logistykę i skuteczność bojową."
 md2026_special_forces_expansion:0 "Rozbudowa sił specjalnych"
 md2026_special_forces_expansion_desc:0 "Rozbudowane siły operacji specjalnych zapewniają większe możliwości działań niekonwencjonalnych."
 md2026_energy_transition:0 "Transformacja energetyczna"
 md2026_energy_transition_desc:0 "Inwestycje w niezależność energetyczną ograniczają zależność od zagranicy i zwiększają odporność gospodarki."
 md2026_digital_transformation:0 "Transformacja cyfrowa"
 md2026_digital_transformation_desc:0 "Krajowy program transformacji cyfrowej modernizuje gospodarkę i zwiększa produktywność."
 md2026_arms_exporter:0 "Przemysł eksportu broni"
 md2026_arms_exporter_desc:0 "Kwitnący przemysł eksportu broni generuje dochody i zwiększa moce produkcyjne sektora zbrojeniowego."

 ### ADDITIONAL NATIONAL SPIRITS ###
 md2026_fra_european_defense_leader:0 "Europejski lider obrony"
 md2026_fra_european_defense_leader_desc:0 "Francja umocniła swoją pozycję wiodącej potęgi wojskowej w UE, promując europejskie inicjatywy autonomii strategicznej."
 md2026_fra_social_unrest:0 "Niepokoje społeczne"
 md2026_fra_social_unrest_desc:0 "Powtarzające się protesty i strajki podważają rządzenie i stabilność polityczną Francji."
 md2026_ita_demographic_crisis:0 "Kryzys demograficzny"
 md2026_ita_demographic_crisis_desc:0 "Malejąca dzietność i starzejące się społeczeństwo Włoch zagrażają długoterminowemu wzrostowi gospodarczemu i zasobom kadrowym armii."
 md2026_ita_right_wing_government:0 "Prawicowy rząd"
 md2026_ita_right_wing_government_desc:0 "Prawicowa koalicja rządząca we Włoszech prowadzi nacjonalistyczną politykę gospodarczą i migracyjną."
 md2026_egy_military_state:0 "Państwo wojskowe"
 md2026_egy_military_state_desc:0 "Egipski establishment wojskowy dominuje w polityce i gospodarce, zapewniając stabilność kosztem swobód obywatelskich."
 md2026_pak_political_instability:0 "Niestabilność polityczna"
 md2026_pak_political_instability_desc:0 "Pakistan zmaga się z chronicznymi kryzysami politycznymi, a cywilne i wojskowe ośrodki władzy pozostają w stałym napięciu."
 md2026_pak_nuclear_deterrent:0 "Odstraszanie jądrowe"
 md2026_pak_nuclear_deterrent_desc:0 "Arsenał jądrowy Pakistanu zapewnia strategiczne odstraszanie wobec większych przeciwników."
 md2026_tai_silicon_shield:0 "Krzemowa tarcza"
 md2026_tai_silicon_shield_desc:0 "Dominacja Tajwanu w produkcji półprzewodników czyni go niezbędnym ogniwem globalnego łańcucha dostaw technologii."
 md2026_tai_china_threat:0 "Chińskie zagrożenie"
 md2026_tai_china_threat_desc:0 "Stałe zagrożenie chińskimi działaniami wojskowymi utrzymuje tajwańskie społeczeństwo w stanie gotowości wojennej."
 md2026_ast_aukus_partner:0 "Partner AUKUS"
 md2026_ast_aukus_partner_desc:0 "Pakt bezpieczeństwa AUKUS z USA i Wielką Brytanią daje Australii dostęp do zaawansowanych technologii wojskowych."
 md2026_can_nato_arctic:0 "Arktyczny obrońca NATO"
 md2026_can_nato_arctic_desc:0 "Strategiczna pozycja Kanady w Arktyce i zaangażowanie na rzecz północnej flanki NATO wzmacniają jej potencjał obronny."
 md2026_spr_territorial_tensions:0 "Napięcia terytorialne"
 md2026_spr_territorial_tensions_desc:0 "Trwające ruchy separatystyczne w Katalonii i Kraju Basków nadwyrężają jedność narodową Hiszpanii."
 md2026_fin_new_nato_member:0 "Nowy członek NATO"
 md2026_fin_new_nato_member_desc:0 "Przystąpienie Finlandii do NATO w 2023 roku zakończyło dekady neutralności, wzmacniając europejską obronę armią gotową do działań bojowych."
 md2026_swe_new_nato_member:0 "Nowy członek NATO"
 md2026_swe_new_nato_member_desc:0 "Członkostwo Szwecji w NATO wzmacnia północny wymiar sojuszu i obronę Morza Bałtyckiego."
 md2026_gre_economic_recovery:0 "Odbudowa gospodarcza"
 md2026_gre_economic_recovery_desc:0 "Grecja stopniowo wychodzi z przedłużającego się kryzysu zadłużenia, a wskaźniki gospodarcze się poprawiają."
 md2026_rom_frontline_nato:0 "Państwo frontowe NATO"
 md2026_rom_frontline_nato_desc:0 "Pozycja Rumunii na południowo-wschodniej flance NATO czyni ją kluczową dla bezpieczeństwa i obrony Morza Czarnego."
 md2026_brm_civil_war_chaos:0 "Chaos wojny domowej"
 md2026_brm_civil_war_chaos_desc:0 "Trwająca wojna domowa w Mjanmie zdewastowała gospodarkę i podzieliła kraj między siły wojskowe a ruch oporu."
 md2026_syr_post_assad:0 "Przejście po Assadzie"
 md2026_syr_post_assad_desc:0 "Upadek reżimu Assada pozostawił Syrię w kruchym okresie przejściowym o niepewnych rządach."
 md2026_saf_load_shedding:0 "Kryzys energetyczny"
 md2026_saf_load_shedding_desc:0 "Chroniczne niedobory energii i degradacja infrastruktury w Republice Południowej Afryki paraliżują produkcję przemysłową."
 md2026_kaz_multi_vector_diplomacy:0 "Dyplomacja wielowektorowa"
 md2026_kaz_multi_vector_diplomacy_desc:0 "Kazachstan balansuje między Rosją, Chinami a Zachodem, wykorzystując swoją pozycję strategiczną i zasoby."
 md2026_blr_russian_satellite:0 "Rosyjskie państwo satelickie"
 md2026_blr_russian_satellite_desc:0 "Białoruś funkcjonuje jako państwo satelickie Rosji, z ograniczoną suwerennością w polityce zagranicznej i wojskowej."
 md2026_geo_eu_aspirations:0 "Aspiracje do UE"
 md2026_geo_eu_aspirations_desc:0 "Kandydatura Gruzji do członkostwa w UE napędza reformy demokratyczne, ale wywołuje napięcia z Rosją."

 ### EVENTS - CLIMATE & ENERGY CRISIS ###
 md2026_climate.1.t:0 "Rekordowa fala upałów"
 md2026_climate.1.d:0 "Bezprecedensowa fala upałów przetacza się przez nasz kraj, bijąc rekordy temperatur i doprowadzając infrastrukturę do granic wytrzymałości. Pożary szaleją na wysuszonych terenach, sieci energetyczne uginają się pod rekordowym zapotrzebowaniem na chłodzenie, a straty w rolnictwie rosną z każdym dniem. Naukowcy ostrzegają, że to zapowiedź nowej klimatycznej rzeczywistości. Musimy zdecydować, jak zareagować."
 md2026_climate.1.o1:0 "Ogłoś stan wyjątkowy klimatyczny"
 md2026_climate.1.o2:0 "Zainwestuj w infrastrukturę adaptacji do zmian klimatu"

 md2026_climate.2.t:0 "Rozdroże transformacji energetycznej"
 md2026_climate.2.d:0 "Globalna transformacja energetyczna osiągnęła punkt krytyczny. Ceny paliw kopalnych pozostają niestabilne, koszty energii odnawialnej stale spadają, a nasza baza przemysłowa wymaga niezawodnej energii. Stajemy na rozdrożu: przyspieszyć transformację ku zielonej energii za znaczące koszty początkowe albo utrzymać pragmatyczny miks energetyczny, który pozostawi paliwa kopalne w grze na kolejne dekady."
 md2026_climate.2.o1:0 "Przyspiesz zieloną transformację"
 md2026_climate.2.o2:0 "Utrzymaj pragmatyczny miks energetyczny"

 md2026_climate.3.t:0 "Wyścig o surowce krytyczne"
 md2026_climate.3.d:0 "Wyścig o surowce krytyczne — lit, kobalt, metale ziem rzadkich — gwałtownie się zaostrzył. Materiały te są niezbędne do produkcji baterii, elektroniki i systemów obronnych. Nasi konkurenci agresywnie zabezpieczają łańcuchy dostaw w Afryce i Ameryce Południowej. Musimy działać, aby zapewnić sobie dostęp do tych strategicznych zasobów."
 md2026_climate.3.o1:0 "Zabezpiecz łańcuchy dostaw surowców przez partnerstwa"
 md2026_climate.3.o2:0 "Zainwestuj w recykling i syntetyczne zamienniki"

 md2026_climate.10.t:0 "Katastrofalna powódź"
 md2026_climate.10.d:0 "Niszczycielskie powodzie monsunowe zalały rozległe obszary kraju. Rzeki wystąpiły z brzegów, wysiedlając miliony ludzi i niszcząc krytyczną infrastrukturę. Pola uprawne są zatopione, co zagraża bezpieczeństwu żywnościowemu. Skala zniszczeń wymaga pilnej odpowiedzi na szczeblu krajowym."
 md2026_climate.10.o1:0 "Zaapeluj o międzynarodową pomoc humanitarną"
 md2026_climate.10.o2:0 "Prowadź akcję ratunkową samodzielnie"

 md2026_climate_news.1.t:0 "Rekordowa fala upałów pustoszy region"
 md2026_climate_news.1.d:0 "Rekordowa fala upałów uderzyła w wiele krajów, powodując rozległe pożary, zniszczenia infrastruktury i ofiary śmiertelne związane z upałami. Naukowcy przypisują ekstremalne temperatury przyspieszającym zmianom klimatu i wzywają do pilnych działań."
 md2026_climate_news.1.o1:0 "Planeta płonie"

 md2026_climate_news.2.t:0 "Katastrofalne powodzie w Azji"
 md2026_climate_news.2.d:0 "Bezprecedensowe powodzie monsunowe spustoszyły duże obszary Azji Południowej i Południowo-Wschodniej, wysiedlając miliony ludzi i niszcząc krytyczną infrastrukturę. Organizacje pomocowe mobilizują się, gdy kryzys humanitarny się pogłębia."
 md2026_climate_news.2.o1:0 "Katastrofa humanitarna"

 ### EVENTS - AI & TECHNOLOGY REVOLUTION ###
 md2026_tech.1.t:0 "Przełom w SI"
 md2026_tech.1.d:0 "Nasze instytuty badawcze dokonały poważnego przełomu w dziedzinie sztucznej inteligencji. Nowy wielkoskalowy system SI wykazuje możliwości znacznie przewyższające obecne modele, co ma głębokie konsekwencje zarówno dla zastosowań cywilnych, jak i wojskowych. Ta technologia może zrewolucjonizować naszą gospodarkę i obronność — lecz to, którą drogę wybierzemy, określi jej wpływ."
 md2026_tech.1.o1:0 "Postaw na wojskowe zastosowania SI"
 md2026_tech.1.o2:0 "Skup się na cywilnych zastosowaniach gospodarczych"

 md2026_tech.2.t:0 "Poważny atak cybernetyczny"
 md2026_tech.2.d:0 "Wyrafinowany atak cybernetyczny sponsorowany przez państwo przeniknął do naszej krytycznej infrastruktury. Sieci energetyczne, systemy finansowe i bazy danych instytucji rządowych zostały naruszone. Agencje wywiadowcze wyśledziły atak do wrogich podmiotów państwowych. Skala i zaawansowanie tego włamania wymagają zdecydowanej odpowiedzi."
 md2026_tech.2.o1:0 "Publicznie wskaż sprawcę i dokonaj odwetu"
 md2026_tech.2.o2:0 "Dyskretnie wzmocnij cyberobronę"

 md2026_tech.3.t:0 "Automatyzacja i utrata miejsc pracy"
 md2026_tech.3.d:0 "Gwałtowny rozwój SI i automatyzacji przekształca rynek pracy. Miliony miejsc pracy w przemyśle, usługach i transporcie są zagrożone likwidacją, gdy inteligentne systemy stają się tańsze i wydajniejsze. Bezrobocie rośnie w dotkniętych sektorach, a niepokój społeczny narasta. Musimy zdecydować, jak pokierować tą transformacją gospodarczą."
 md2026_tech.3.o1:0 "Uruchom powszechne programy przekwalifikowania"
 md2026_tech.3.o2:0 "Pozwól rynkowi dostosować się naturalnie"
 md2026_tech.3.o3:0 "Reguluj wdrażanie SI, by chronić miejsca pracy"

 md2026_tech.10.t:0 "Kamień milowy komputerów kwantowych"
 md2026_tech.10.d:0 "Nasi naukowcy osiągnęli znaczący kamień milowy w dziedzinie komputerów kwantowych, dowodząc przewagi kwantowej nad komputerami klasycznymi w praktycznych zastosowaniach. Ten przełom ma głębokie konsekwencje dla kryptografii, odkrywania leków, inżynierii materiałowej i wywiadu wojskowego. Wyścig o wykorzystanie mocy kwantowej trwa."
 md2026_tech.10.o1:0 "Priorytet dla zastosowań wojskowych — łamanie szyfrów"
 md2026_tech.10.o2:0 "Skup się na zastosowaniach naukowo-badawczych"

 md2026_tech_news.1.t:0 "Przełom w SI wstrząsa światem"
 md2026_tech_news.1.d:0 "Ogłoszono poważny przełom w dziedzinie sztucznej inteligencji — nowy system wykazuje bezprecedensowe możliwości. Eksperci debatują, czy oznacza to początek rewolucji SI, która przekształci światową gospodarkę i układ sił militarnych."
 md2026_tech_news.1.o1:0 "Nadchodzi era SI"

 md2026_tech_news.2.t:0 "Potężny atak cybernetyczny uderza w mocarstwo"
 md2026_tech_news.2.d:0 "Niszczycielski atak cybernetyczny uderzył w krytyczną infrastrukturę dużego państwa, zakłócając pracę sieci energetycznych i systemów finansowych. Agencje wywiadowcze przypisują atak hakerom sponsorowanym przez państwo, co oznacza nową eskalację niewidzialnej wojny toczonej w sieciach cyfrowych."
 md2026_tech_news.2.o1:0 "Cyfrowe pole bitwy się rozrasta"

 ### EVENTS - DEMOGRAPHICS & POPULATION ###
 md2026_demographics.1.t:0 "Kryzys starzenia się społeczeństwa"
 md2026_demographics.1.d:0 "Nasz kraj stoi w obliczu demograficznej bomby zegarowej. Społeczeństwo starzeje się szybko, a grupa w wieku produkcyjnym kurczy się z roku na rok. Systemy emerytalne uginają się pod rosnącymi kosztami, popyt na opiekę zdrowotną gwałtownie rośnie, a zasoby rekrutacyjne wojska wysychają. Bez działań nieunikniony jest upadek gospodarczy. Musimy wybrać naszą dalszą drogę."
 md2026_demographics.1.o1:0 "Reforma polityki imigracyjnej"
 md2026_demographics.1.o2:0 "Zainwestuj w automatyzację i robotykę"
 md2026_demographics.1.o3:0 "Uruchom politykę pronatalistyczną"

 md2026_demographics.2.t:0 "Niestabilność wyżu demograficznego"
 md2026_demographics.2.d:0 "Ogromna populacja młodzieży stoi w obliczu ponurych perspektyw zatrudnienia. Ponad połowa społeczeństwa ma mniej niż 30 lat, a bezrobocie wśród młodych jest powszechne — frustracja wrze w miastach i miasteczkach. Ta demograficzna beczka prochu zagraża stabilności społecznej i legitymizacji reżimu. Musimy znaleźć sposób na ukierunkowanie tej energii."
 md2026_demographics.2.o1:0 "Uruchom masowe programy zatrudnienia"
 md2026_demographics.2.o2:0 "Kampania rekrutacyjna do wojska"
 md2026_demographics.2.o3:0 "Zachęcaj do emigracji, by zmniejszyć presję"

 md2026_demographics.3.t:0 "Drenaż mózgów"
 md2026_demographics.3.d:0 "Nasi najzdolniejsi obywatele wyjeżdżają masowo. Wykwalifikowani specjaliści, naukowcy i przedsiębiorcy emigrują do bogatszych państw oferujących lepsze możliwości. Ten drenaż mózgów osłabia nasz kapitał ludzki i spowalnia rozwój gospodarczy. Musimy znaleźć sposoby na zatrzymanie talentów lub wykorzystanie potencjału naszej diaspory."
 md2026_demographics.3.o1:0 "Zachęty do pozostania i reforma wynagrodzeń"
 md2026_demographics.3.o2:0 "Program zaangażowania diaspory"
 md2026_demographics.3.o3:0 "Zaakceptuj rzeczywistość i dostosuj się"

 md2026_demographics.10.t:0 "Presja urbanizacyjna"
 md2026_demographics.10.d:0 "Nasze megamiasta pękają w szwach. Gwałtowna urbanizacja przeciąża infrastrukturę ponad jej możliwości — systemy wodne zawodzą, ruch paraliżuje ulice, slumsy się rozrastają, a jakość powietrza się pogarsza. Rozwoju nie da się zatrzymać, ale to, jak nim pokierujemy, zdecyduje, czy nasze miasta staną się motorami dobrobytu, czy kotłami chaosu."
 md2026_demographics.10.o1:0 "Inwestycje w inteligentne miasta"
 md2026_demographics.10.o2:0 "Decentralizacja i rozwój regionalny"

 md2026_demographics_news.1.t:0 "Kryzys starzenia się ludności dotyka kraje rozwinięte"
 md2026_demographics_news.1.d:0 "Wiele krajów rozwiniętych zmaga się z pogłębiającym się kryzysem demograficznym, ponieważ wskaźnik urodzeń gwałtownie spada, a społeczeństwa szybko się starzeją. Ekonomiści ostrzegają przed poważnymi długoterminowymi konsekwencjami dla systemów emerytalnych, opieki zdrowotnej i wzrostu gospodarczego w całym świecie uprzemysłowionym."
 md2026_demographics_news.1.o1:0 "Kryzys w zwolnionym tempie"

 ### EVENTS - SPACE RACE ###
 md2026_space.1.t:0 "Nowy wyścig kosmiczny"
 md2026_space.1.d:0 "Rozpoczął się nowy wyścig kosmiczny. Nasz kraj stoi u progu historycznego osiągnięcia — powrotu ludzi na Księżyc i ustanowienia stałej obecności poza Ziemią. Konkurencja jest zaciekła, a rywalizujące mocarstwa przyspieszają własne programy. Nie chodzi tu tylko o naukę; chodzi o prestiż, zasoby i przewagę wojskową na najwyższym ze szczytów."
 md2026_space.1.o1:0 "Przyspiesz program załogowego lotu na Księżyc"
 md2026_space.1.o2:0 "Postaw na komercyjne partnerstwa kosmiczne"

 md2026_space.2.t:0 "Incydent z testem broni antysatelitarnej"
 md2026_space.2.d:0 "Rywalizujące mocarstwo przeprowadziło niszczycielski test broni antysatelitarnej, niszcząc jednego ze swoich satelitów i tworząc ogromne pole odłamków na niskiej orbicie okołoziemskiej. Odłamki zagrażają naszym satelitom, Międzynarodowej Stacji Kosmicznej i komercyjnym operacjom kosmicznym. Ten prowokacyjny czyn wymaga odpowiedzi."
 md2026_space.2.o1:0 "Potęp i zaproponuj kontrolę zbrojeń w kosmosie"
 md2026_space.2.o2:0 "Przyspiesz rozwój własnych zdolności antysatelitarnych"

 md2026_space.3.t:0 "Komercyjny boom kosmiczny"
 md2026_space.3.d:0 "Prywatne firmy kosmiczne rewolucjonizują dostęp do orbity. Rakiety wielokrotnego użytku obniżyły koszty startów, konstelacje satelitów obiecują globalny zasięg internetu, a turystyka kosmiczna staje się rzeczywistością. Ten boom to okazja, by wykorzystać prywatne innowacje dla narodowej przewagi strategicznej."
 md2026_space.3.o1:0 "Partnerstwa publiczno-prywatne w kosmosie"
 md2026_space.3.o2:0 "Kontrakty wojskowe na usługi kosmiczne"

 md2026_space.10.t:0 "Wyścig konstelacji satelitarnych"
 md2026_space.10.d:0 "Wyścig o dominację na niskiej orbicie okołoziemskiej za pomocą ogromnych konstelacji satelitarnych się zaostrzył. Sieci te zapewniają globalną łączność, nadzór w czasie rzeczywistym i precyzyjną nawigację — zdolności o ogromnej wartości cywilnej i wojskowej. Nasi przeciwnicy rozwijają własne konstelacje w zawrotnym tempie."
 md2026_space.10.o1:0 "Rozmieść wojskową konstelację satelitarną"
 md2026_space.10.o2:0 "Zainwestuj w cywilną konstelację szerokopasmową"

 md2026_space_news.1.t:0 "Zaczyna się nowy wyścig kosmiczny!"
 md2026_space_news.1.d:0 "Mocarstwo ogłosiło przyspieszony program powrotu ludzi na Księżyc i ustanowienia stałej bazy księżycowej. To ogłoszenie zwiastuje początek nowego wyścigu kosmicznego o głębokich konsekwencjach dla nauki, technologii i dominacji wojskowej."
 md2026_space_news.1.o1:0 "Na Księżyc i dalej"

 md2026_space_news.2.t:0 "Test antysatelitarny wywołuje kryzys odłamków kosmicznych"
 md2026_space_news.2.d:0 "Niszczycielski test broni antysatelitarnej wytworzył tysiące odłamków na niskiej orbicie okołoziemskiej, zagrażając satelitom i statkom załogowym. Społeczność międzynarodowa potępia ten lekkomyślny czyn, gdy kosmos staje się coraz bardziej sporną domeną."
 md2026_space_news.2.o1:0 "Kosmos staje się polem bitwy"

 ### DECISION CATEGORIES - Internal Politics & Nuclear ###
 md2026_internal_politics_category:0 "Polityka wewnętrzna"
 md2026_internal_politics_category_desc:0 "Decyzje polityczne dotyczące spraw wewnętrznych, odzwierciedlające wewnętrzne zmagania, wybory polityczne i programy strategiczne mocarstw w 2026 roku."
 md2026_nuclear_category:0 "Programy nuklearne"
 md2026_nuclear_category_desc:0 "Decyzje dotyczące rozwoju, modernizacji i strategicznej postawy broni jądrowej, dostępne dla państw posiadających broń jądrową oraz tych, które aspirują do jej posiadania."

 ### EVENTS - SYSTEM ###
 md2026_system.1.t:0 "Świat w 2026 roku"
 md2026_system.1.d:0 "1 stycznia 2026 roku. Świat stoi na rozdrożu. Wojna w Ukrainie trwa już czwarty rok. Chiny demonstrują swoją siłę militarną w Cieśninie Tajwańskiej. Bliski Wschód pozostaje beczką prochu. Zmiany klimatu przyspieszają. SI przekształca gospodarki. Stary porządek się rozpada — a nowy wciąż nie nabrał kształtu. Decyzje podjęte w najbliższych latach zadecydują o losach narodów."
 md2026_system.1.o1:0 "Wolny świat zwycięży."
 md2026_system.1.o2:0 "Wyłania się nowy porządek multipolarny."
 md2026_system.1.o3:0 "Musimy wytyczyć własny kurs."
 md2026_system.2.t:0 "2027: podsumowanie roku"
 md2026_system.2.d:0 "Minął rok od rozpoczęcia naszego scenariusza. Świat się zmienił — sojusze się przesunęły, konflikty ewoluowały, a układ sił wciąż się przekształca. Co przyniesie kolejny rok?"
 md2026_system.2.o1:0 "Naprzód."
 md2026_system.3.t:0 "Globalne turbulencje gospodarcze"
 md2026_system.3.d:0 "Fala niestabilności gospodarczej uderzyła w naszą gospodarkę. Zakłócenia w łańcuchach dostaw, rosnące zadłużenie i niepewność geopolityczna złożyły się na poważne przeciwności. Nasi ekonomiści debatują nad najlepszą drogą — oszczędności dla stabilizacji finansów czy wydatki stymulacyjne dla utrzymania wzrostu."
 md2026_system.3.o1:0 "Wprowadź środki oszczędnościowe"
 md2026_system.3.o2:0 "Wydatki stymulacyjne"

 ### EVENTS - NATO ARTICLE 5 ###
 md2026_nato_article5.1.t:0 "NATO pod atakiem!"
 md2026_nato_article5.1.d:0 "Sojusznik NATO został zaatakowany przez wrogie mocarstwo. Jako przywódca Sojuszu Atlantyckiego Stany Zjednoczone muszą zdecydować, czy uruchomić Artykuł 5 — klauzulę zbiorowej obrony, która uznaje atak na jednego członka za atak na wszystkich. Ta decyzja określi przyszłość sojuszu."
 md2026_nato_article5.1.o1:0 "Uruchom Artykuł 5 — zbiorowa obrona!"
 md2026_nato_article5.1.o2:0 "Potęp atak, ale nie uruchamiaj Artykułu 5"
 md2026_nato_article5.2.t:0 "Artykuł 5 uruchomiony: solidarność z sojuszem"
 md2026_nato_article5.2.d:0 "Stany Zjednoczone uruchomiły Artykuł 5 NATO. Jako członek Sojuszu Atlantyckiego jesteśmy wezwani do wypełnienia zobowiązań traktatowych i włączenia się w zbiorową obronę naszego sojusznika. Pytanie brzmi, jak daleko jesteśmy gotowi się posunąć."
 md2026_nato_article5.2.o1:0 "Pełne zaangażowanie — mobilizuj nasze siły"
 md2026_nato_article5.2.o2:0 "Tylko ograniczone wsparcie"
 md2026_nato_article5.2.o3:0 "Odmów udziału"
 md2026_nato_article5.3.t:0 "Zakończenie działania Artykułu 5"
 md2026_nato_article5.3.d:0 "Konflikt, który uruchomił Artykuł 5 NATO, dobiegł końca. Po przywróceniu pokoju sojusz może zakończyć stan podwyższonej gotowości. Nasze siły odznaczyły się w czasie tego kryzysu."
 md2026_nato_article5.3.o1:0 "Zakończ gotowość i wróć do stanu pokojowego"

 ### EVENTS - ELECTIONS (New Countries) ###
 md2026_elections.30.t:0 "Niemcy: wybory federalne 2029"
 md2026_elections.30.d:0 "Przed nami wybory federalne w Niemczech. Kraj stoi przed kluczowymi wyborami dotyczącymi przyszłego kierunku — kontynuacji centrystycznych rządów CDU, powrotu do socjaldemokracji, kontrowersyjnego zwrotu ku nacjonalistycznej AfD lub progresywnej koalicji pod przewodnictwem Zielonych. Wynik ukształtuje największą gospodarkę Europy oraz jej rolę w UE i NATO."
 md2026_elections.30.o1:0 "Zwycięstwo CDU/CSU — Friedrich Merz pozostaje"
 md2026_elections.30.o2:0 "Zwycięstwo SPD — Boris Pistorius"
 md2026_elections.30.o3:0 "Wzrost poparcia dla AfD — Alice Weidel"
 md2026_elections.30.o4:0 "Koalicja pod przewodnictwem Zielonych — Robert Habeck"

 md2026_elections.40.t:0 "Wielka Brytania: wybory powszechne 2029"
 md2026_elections.40.d:0 "Wielka Brytania idzie do urn. Po latach politycznych zawirowań, wstrząsów po brexicie i wyzwań gospodarczych wyborcy muszą wybrać między kontynuacją rządów Partii Pracy pod Starmerem, odrodzeniem Konserwatystów pod przywództwem Kemi Badenoch a populistycznym wzrostem Reform UK pod wodzą Nigela Farage'a."
 md2026_elections.40.o1:0 "Ponowny wybór Partii Pracy — Keir Starmer pozostaje"
 md2026_elections.40.o2:0 "Zwycięstwo Konserwatystów — Kemi Badenoch"
 md2026_elections.40.o3:0 "Przełom Reform UK — Nigel Farage"

 md2026_elections.50.t:0 "Japonia: wybory powszechne 2028"
 md2026_elections.50.d:0 "Japonia przeprowadza wybory powszechne w atmosferze rosnących napięć regionalnych. Długo dominująca PLD stara się utrzymać władzę, lawirując między reformą gospodarczą, modernizacją wojska i rosnącym zagrożeniem ze strony Chin i Korei Północnej. Opozycja przedstawia alternatywną wizję przyszłości Japonii."
 md2026_elections.50.o1:0 "PLD utrzymuje władzę — Shigeru Ishiba pozostaje"
 md2026_elections.50.o2:0 "Zwycięstwo koalicji opozycyjnej — Yoshihiko Noda"
 md2026_elections.50.o3:0 "Górę biorą jastrzębie z PLD — Takayuki Kobayashi"

 md2026_elections.60.t:0 "Korea Południowa: wybory prezydenckie 2027"
 md2026_elections.60.d:0 "Korea Południowa przeprowadza kluczowe wybory prezydenckie po kryzysie związanym ze stanem wojennym z 2024 roku, który wstrząsnął demokratycznymi fundamentami kraju. Kraj musi wybrać przywódcę, który potrafi uleczyć podziały polityczne, stawić czoła zagrożeniu ze strony Korei Północnej i przywrócić stabilność instytucjonalną."
 md2026_elections.60.o1:0 "Zwycięstwo liberałów — Lee Jae-myung"
 md2026_elections.60.o2:0 "Przywrócenie konserwatystów — Han Dong-hoon"
 md2026_elections.60.o3:0 "Kryzys polityczny się pogłębia — brak wyraźnego zwycięzcy"

 md2026_elections.70.t:0 "Brazylia: wybory prezydenckie 2030"
 md2026_elections.70.d:0 "Wybory prezydenckie w Brazylii odbywają się, gdy kraj lawiruje między konkurencyjnymi wizjami: kontynuacją lewicowych rządów i programów społecznych, powrotem prawicowego populizmu lub centrystyczną trzecią drogą. Amazonia, członkostwo w BRICS i nierówności gospodarcze dominują w kampanii."
 md2026_elections.70.o1:0 "Ciągłość PT — Fernando Haddad"
 md2026_elections.70.o2:0 "Powrót frakcji Bolsonaro — Tarcísio de Freitas"
 md2026_elections.70.o3:0 "Centrystyczna trzecia droga — Simone Tebet"

 md2026_elections.80.t:0 "Polska: wybory parlamentarne 2027"
 md2026_elections.80.d:0 "Polska idzie do urn, a stawką jest jej bezpieczeństwo, stosunki z UE i instytucje demokratyczne. Koalicja Tuska zabiega o reelekcję pod hasłem integracji z UE i przywrócenia demokracji, a PiS chce wrócić do władzy ze swoją nacjonalistyczną wizją. Pojawia się także nowa alternatywa centroprawicowa."
 md2026_elections.80.o1:0 "Koalicja Tuska wygrywa ponownie — Donald Tusk"
 md2026_elections.80.o2:0 "PiS wraca do władzy — Mateusz Morawiecki"
 md2026_elections.80.o3:0 "Nowa centroprawica — Rafał Trzaskowski"

 md2026_elections.90.t:0 "Włochy: wybory powszechne 2028"
 md2026_elections.90.d:0 "Włoskie wybory powszechne stawiają rządzącą prawicową koalicję pod wodzą Giorgii Meloni przeciwko ożywionej centrolewicy prowadzonej przez Elly Schlein oraz nieprzewidywalnemu Ruchowi Pięciu Gwiazd pod wodzą Giuseppe Contego. Rola Włoch w UE, ich polityka migracyjna i reformy gospodarcze są na szali."
 md2026_elections.90.o1:0 "Meloni ponownie wybrana — Fratelli d'Italia"
 md2026_elections.90.o2:0 "Koalicja centrolewicowa — Elly Schlein"
 md2026_elections.90.o3:0 "Wzrost Ruchu Pięciu Gwiazd — Giuseppe Conte"

 ### EVENTS - RANDOM ###
 md2026_random.1.t:0 "Incydent graniczny"
 md2026_random.1.d:0 "Wzdłuż naszej granicy doszło do napiętego incydentu. Siły zbrojne sąsiedniego państwa zaangażowanego w trwający konflikt wkroczyły na nasze terytorium, co doprowadziło do krótkiego, lecz niepokojącego impasu. Nasza armia jest w stanie wysokiej gotowości. Musimy zdecydować, jak odpowiedzieć — drogą dyplomatyczną czy demonstracją siły."
 md2026_random.1.o1:0 "Odpowiedź dyplomatyczna"
 md2026_random.1.o2:0 "Demonstracja siły militarnej"

 md2026_random.2.t:0 "Uderza klęska żywiołowa"
 md2026_random.2.d:0 "Niszczycielska klęska żywiołowa dotknęła nasz kraj, powodując rozległe zniszczenia infrastruktury i wysiedlenie tysięcy obywateli. Katastrofa przerosła możliwości lokalnych służb ratunkowych. Musimy zdecydować, czy podjąć akcję ratunkową własnymi siłami, czy zwrócić się o pomoc do społeczności międzynarodowej."
 md2026_random.2.o1:0 "Krajowa pomoc ratunkowa"
 md2026_random.2.o2:0 "Zwróć się o pomoc międzynarodową"

 md2026_random.3.t:0 "Przełom technologiczny"
 md2026_random.3.d:0 "Nasi badacze dokonali znaczącego przełomu w zaawansowanej technologii. To odkrycie ma potencjalne zastosowania zarówno cywilne, jak i wojskowe. Musimy zdecydować, czy zainwestować w rozwój komercyjny, aby pobudzić gospodarkę, czy skierować ten przełom na zastosowania wojskowe dla uzyskania przewagi strategicznej."
 md2026_random.3.o1:0 "Zainwestuj w komercjalizację"
 md2026_random.3.o2:0 "Zastosowania wojskowe"

 md2026_random.4.t:0 "Incydent terrorystyczny"
 md2026_random.4.d:0 "Atak terrorystyczny dotknął nasz kraj, zabijając cywilów i siejąc strach. Społeczeństwo domaga się działań. Możemy odpowiedzieć zaostrzeniem środków bezpieczeństwa, które może ograniczyć wolności obywatelskie, ale zwiększy poparcie dla wojny, albo położyć nacisk na jedność narodową i odporność, zachowując nasze wartości demokratyczne."
 md2026_random.4.o1:0 "Zaostrzenie środków bezpieczeństwa"
 md2026_random.4.o2:0 "Jedność i odporność"

 md2026_random.5.t:0 "Strach przed pandemią"
 md2026_random.5.d:0 "Pojawił się nowy patogen, budząc obawy o globalną pandemię. Władze sanitarne ostrzegają przed potencjalnymi masowymi ofiarami, jeśli choroba rozprzestrzeni się niepowstrzymana. Musimy wybrać między surowymi środkami izolacji, które zaszkodzą gospodarce, ale spowolnią rozprzestrzenianie się choroby, a utrzymaniem gospodarki otwartej i akceptacją ryzyka zdrowotnego."
 md2026_random.5.o1:0 "Wprowadź środki izolacji"
 md2026_random.5.o2:0 "Utrzymaj gospodarkę otwartą"

 md2026_random.6.t:0 "Krach na rynku"
 md2026_random.6.d:0 "Nagły i gwałtowny krach na rynkach finansowych wstrząsnął naszą gospodarką. Główne banki i korporacje stoją w obliczu potencjalnej niewypłacalności. Musimy wybrać między kosztownym pakietem ratunkowym stabilizującym system finansowy a pozwoleniem rynkowi na samoregulację — procesem bolesnym, ale potencjalnie oczyszczającym."
 md2026_random.6.o1:0 "Pakiet ratunkowy"
 md2026_random.6.o2:0 "Pozwól rynkowi na samoregulację"

 md2026_random.7.t:0 "Atak cybernetyczny na krytyczną infrastrukturę"
 md2026_random.7.d:0 "Wyrafinowany atak cybernetyczny wymierzony został w naszą krytyczną infrastrukturę — sieci energetyczne, sieci komunikacyjne i systemy rządowe zostały naruszone. Wywiad wskazuje na operację sponsorowaną przez państwo. Możemy zainwestować mocno w cyberobronę, aby zapobiec przyszłym atakom, albo przeprowadzić odwetowe operacje cybernetyczne przeciw domniemanemu sprawcy."
 md2026_random.7.o1:0 "Zainwestuj w cyberobronę"
 md2026_random.7.o2:0 "Odwetowe operacje cybernetyczne"

 md2026_random.8.t:0 "Masowe protesty"
 md2026_random.8.d:0 "W naszych głównych miastach wybuchły masowe protesty. Obywatele domagają się zmian politycznych, reform gospodarczych i większej odpowiedzialności rządu. Jeśli nie zostaną uwzględnione, protesty mogą zdestabilizować nasz kraj. Możemy pójść na ustępstwa wobec protestujących albo stłumić protesty, by przywrócić porządek."
 md2026_random.8.o1:0 "Idź na ustępstwa"
 md2026_random.8.o2:0 "Stłum protesty"

 ### NATIONAL SPIRITS - Country-Specific ###
 md2026_jap_demographic_crisis:0 "Kryzys demograficzny"
 md2026_jap_demographic_crisis_desc:0 "Japonia zmaga się z poważnym kryzysem demograficznym. Wskaźnik urodzeń spadł do historycznie niskiego poziomu, a społeczeństwo szybko się starzeje. Kurcząca się siła robocza zagraża produktywności gospodarczej, obciąża system emerytalny i stwarza problemy kadrowe dla Sił Samoobrony."
 md2026_kor_political_crisis:0 "Kryzys polityczny"
 md2026_kor_political_crisis_desc:0 "Następstwa incydentu ze stanem wojennym z 2024 roku pogrążyły Koreę Południową w głębokim kryzysie politycznym. Zaufanie publiczne do instytucji zostało zachwiane, podziały partyjne się pogłębiły, a establishment polityczny z trudem przywraca stabilność i demokratyczną normalność."
 md2026_sau_vision_2030:0 "Wizja 2030"
 md2026_sau_vision_2030_desc:0 "Ambitny program Wizja 2030 Arabii Saudyjskiej ma na celu uniezależnienie gospodarki od ropy naftowej, rozwój sektorów turystyki i rozrywki oraz modernizację społeczeństwa. Ogromne inwestycje w infrastrukturę, technologię i megaprojekty, takie jak NEOM, przekształcają królestwo."
 md2026_sud_civil_war:0 "Wojna domowa"
 md2026_sud_civil_war_desc:0 "Sudan pogrążony jest w wyniszczającej wojnie domowej między Siłami Zbrojnymi Sudanu a Siłami Szybkiego Wsparcia. Konflikt wywołał katastrofę humanitarną, wysiedlił miliony ludzi i obrócił infrastrukturę kraju w ruinę. Stabilność pozostaje odległą nadzieją."
 md2026_yem_houthi_division:0 "Podział Jemenu"
 md2026_yem_houthi_division_desc:0 "Jemen pozostaje podzielony między uznawany na arenie międzynarodowej rząd a ruch Huti, który kontroluje większość północy, w tym stolicę Sanę. Ataki Huti na żeglugę na Morzu Czerwonym przyciągnęły uwagę międzynarodową, a kryzys humanitarny się pogłębia."
 md2026_raj_hindu_nationalism:0 "Nacjonalizm hinduski"
 md2026_raj_hindu_nationalism_desc:0 "Rząd BJP promuje wizję hinduskiego nacjonalizmu kulturowego, która mobilizuje jego bazę polityczną, ale tworzy napięcia społeczne. Polityka podkreślająca tożsamość hinduską kształtuje zarządzanie, politykę zagraniczną i dyskurs wewnętrzny, a krytycy ostrzegają przed erozją demokracji."
 md2026_raj_digital_india:0 "Cyfrowe Indie"
 md2026_raj_digital_india_desc:0 "Inicjatywa Cyfrowe Indie stworzyła jedną z największych na świecie sieci infrastruktury cyfrowej. System Aadhaar, płatności UPI i platformy cyfrowego zarządzania zrewolucjonizowały usługi publiczne i zwiększyły efektywność gospodarki, pozycjonując Indie jako globalny hub technologiczny."
 md2026_sov_shadow_economy:0 "Szara strefa"
 md2026_sov_shadow_economy_desc:0 "Pod presją zachodnich sankcji Rosja rozwinęła rozległą szarą strefę. Równoległe importy, transakcje kryptowalutowe i sieci handlu pośredniego pomagają obchodzić ograniczenia, utrzymując aktywność gospodarczą kosztem przejrzystości i integralności instytucjonalnej."
 md2026_eth_post_tigray:0 "Odbudowa po Tigraju"
 md2026_eth_post_tigray_desc:0 "Etiopia wciąż podnosi się po wyniszczającej wojnie w Tigraju. Choć porozumienie z Pretorii przyniosło zawieszenie broni, głębokie blizny pozostają — wysiedlona ludność, zniszczona infrastruktura i nierozwiązane żale polityczne wciąż stanowią wyzwanie dla jedności narodowej i wysiłków odbudowy."
 md2026_uae_economic_diversification:0 "Dywersyfikacja gospodarcza"
 md2026_uae_economic_diversification_desc:0 "ZEA agresywnie dywersyfikują swoją gospodarkę poza sektor naftowy, inwestując mocno w finanse, turystykę, technologię i logistykę. Dubaj i Abu Zabi stały się globalnymi centrami biznesu, przyciągając międzynarodowe talenty i kapitał oraz budując fundament gospodarczy na czas po ropie."
 md2026_hun_illiberal_democracy:0 "Demokracja nieliberalna"
 md2026_hun_illiberal_democracy_desc:0 "Węgry pod rządami Viktora Orbána przyjęły model demokracji nieliberalnej — konsolidując władzę polityczną, ograniczając niezależność mediów i spierając się z instytucjami UE o praworządność. Takie podejście zapewnia wewnętrzną stabilność polityczną, ale nadweręża stosunki z zachodnimi sojusznikami."

 ### NATIONAL SPIRITS - Systemic ###
 md2026_war_exhaustion_1:0 "Zmęczenie wojną"
 md2026_war_exhaustion_1_desc:0 "Przedłużający się konflikt zaczyna odciskać piętno na naszym narodzie. Cierpliwość społeczeństwa słabnie, koszty gospodarcze rosną, a obciążenie naszej armii staje się widoczne. Jeśli wojna będzie trwać, sytuacja może się jeszcze pogorszyć."
 md2026_war_exhaustion_2:0 "Poważne zmęczenie wojną"
 md2026_war_exhaustion_2_desc:0 "Wojna ciężko doświadczyła nasz naród. Liczba ofiar rośnie, gospodarka cierpi, a poparcie społeczne dla konfliktu gwałtownie spada. Morale słabnie, a pobór staje się coraz trudniejszy. Trzeba szybko znaleźć rozwiązanie."
 md2026_war_exhaustion_3:0 "Krytyczne zmęczenie wojną"
 md2026_war_exhaustion_3_desc:0 "Nasz kraj jest na granicy wytrzymałości. Lata wojny zdziesiątkowały gospodarkę, wyczerpały zasoby ludzkie armii i zrujnowały morale społeczeństwa. Dezercje rosną, przemysł się załamuje, a ludność domaga się pokoju niemal za każdą cenę."
 md2026_nuclear_deterrent:0 "Odstraszanie nuklearne"
 md2026_nuclear_deterrent_desc:0 "Nasz kraj opracował broń jądrową, zyskując potężny środek odstraszania strategicznego wobec potencjalnych agresorów. Choć arsenał jądrowy wzmacnia naszą postawę obronną i pozycję międzynarodową, jego utrzymanie wymaga znacznych zasobów i podnosi napięcia globalne."
 md2026_nato_article5_active:0 "Artykuł 5 NATO w mocy"
 md2026_nato_article5_active_desc:0 "Uruchomiono klauzulę zbiorowej obrony Artykułu 5 NATO. Jako zaangażowany członek sojuszu nasz kraj zmobilizował siły i postawił wojsko w stan podwyższonej gotowości. Sojusz stoi zjednoczony w obronie swoich członków."
 md2026_sanctions_tier_mild:0 "Łagodne sankcje międzynarodowe"
 md2026_sanctions_tier_mild_desc:0 "Nasz kraj objęty jest ograniczonymi sankcjami międzynarodowymi. Nałożono ograniczenia handlowe i kary dyplomatyczne, powodując niewielkie zakłócenia gospodarcze. Sankcje sygnalizują dezaprobatę międzynarodową, ale pozostają do udźwignięcia."
 md2026_sanctions_tier_moderate:0 "Umiarkowane sankcje międzynarodowe"
 md2026_sanctions_tier_moderate_desc:0 "Na nasz kraj nałożono znaczące sankcje międzynarodowe. Wolumen handlu spada, wydajność przemysłu cierpi, a dobra konsumpcyjne stają się coraz trudniej dostępne. Wpływ na gospodarkę jest duży i wciąż rośnie."
 md2026_sanctions_tier_severe:0 "Dotkliwe sankcje międzynarodowe"
 md2026_sanctions_tier_severe_desc:0 "Nasz kraj objęty jest dotkliwymi sankcjami międzynarodowymi, które paraliżują gospodarkę. Główni partnerzy handlowi zerwali stosunki, produkcja przemysłowa gwałtownie spadła, a dostęp do zaawansowanych technologii jest ograniczony. Możliwości badawcze słabną wraz z upadkiem międzynarodowej współpracy naukowej."
 md2026_sanctions_tier_total:0 "Całkowite sankcje międzynarodowe"
 md2026_sanctions_tier_total_desc:0 "Nasz kraj podlega wszechstronnym sankcjom międzynarodowym oznaczającym niemal całkowitą izolację gospodarczą. Handel praktycznie zamarł, przemysł działa na ułamku swoich możliwości, a luka technologiczna wobec przeciwników powiększa się z każdym dniem. Gospodarka znajduje się w swobodnym spadku."
 md2026_reconstruction_effort:0 "Wysiłek odbudowy"
 md2026_reconstruction_effort_desc:0 "Wraz z zakończeniem walk trwa zakrojona na szeroką skalę odbudowa. Zasoby kierowane są na odbudowę zniszczonej infrastruktury, fabryk i mieszkań. Choć kosztowna, odbudowa niesie nadzieję na ożywienie i przywrócenie stabilności."
 md2026_brics_development_bank:0 "Bank Rozwoju BRICS"
 md2026_brics_development_bank_desc:0 "Nasz kraj przystąpił do Nowego Banku Rozwoju BRICS, zyskując dostęp do alternatywnego finansowania projektów infrastrukturalnych i rozwojowych poza zdominowanym przez Zachód systemem finansowym. Daje to umiarkowane korzyści gospodarcze i wzmacnia współpracę Południe–Południe."

 ### NATIONAL SPIRITS - Focus Tree Enrichment ###
 md2026_usa_labor_shortage:0 "Niedobór siły roboczej"
 md2026_usa_labor_shortage_desc:0 "Stany Zjednoczone borykają się z utrzymującym się niedoborem siły roboczej w kluczowych gałęziach gospodarki. Starzenie się siły roboczej, restrykcyjna polityka imigracyjna i zmieniające się preferencje zawodowe sprawiają, że fabryki, gospodarstwa rolne i sektor usług mają trudności z obsadzeniem stanowisk, co ogranicza wyniki gospodarcze."
 md2026_usa_trade_war_tariffs:0 "Cła wojny handlowej"
 md2026_usa_trade_war_tariffs_desc:0 "Na import od głównych partnerów handlowych nałożono szeroko zakrojone cła, przekształcając globalne przepływy handlowe. Mają one chronić rodzimy przemysł i ściągnąć produkcję z powrotem do kraju, ale podnoszą ceny dla konsumentów i prowokują środki odwetowe ze strony poszkodowanych państw."
 md2026_sov_war_economy:0 "Gospodarka wojenna"
 md2026_sov_war_economy_desc:0 "Rosja przestawiła się na gospodarkę wojenną, kierując moce przemysłowe na potrzeby produkcji zbrojeniowej. Fabryki broni pracują przez całą dobę, a konsumpcja cywilna została ograniczona. Ta transformacja zwiększa produkcję wojskową kosztem stabilności i poziomu życia."
 md2026_sov_sanctions_evasion:0 "Sieci obchodzenia sankcji"
 md2026_sov_sanctions_evasion_desc:0 "Rosja zbudowała rozbudowane sieci obchodzenia zachodnich sankcji, kierując handel przez kraje pośredniczące i stosując schematy importu równoległego. Sieci te częściowo kompensują skutki sankcji, utrzymując dostęp do kluczowych towarów i technologii."
 md2026_ukr_resistance:0 "Opór narodowy"
 md2026_ukr_resistance_desc:0 "Naród ukraiński zjednoczył się w zaciekłym oporze przeciw rosyjskiej inwazji. Duch jedności narodowej i buntu przenika zarówno siły zbrojne, jak i ludność cywilną. Bataliony ochotnicze, jednostki obrony terytorialnej i sieci partyzanckie wzmacniają zdolności obronne kraju."
 md2026_ukr_nato_candidate:0 "Status kandydata do NATO"
 md2026_ukr_nato_candidate_desc:0 "Ukrainie przyznano status kandydata do NATO, co sygnalizuje zaangażowanie sojuszu w jej przyszłe członkostwo. Daje to legitymację dyplomatyczną, dostęp do standardów i szkoleń NATO oraz wzmacnia determinację polityczną państwa."
 md2026_chi_national_rejuvenation:0 "Odrodzenie narodowe"
 md2026_chi_national_rejuvenation_desc:0 "Chiny realizują „wielkie odrodzenie narodu chińskiego” — wszechstronny program modernizacji obejmujący unowocześnienie przemysłu, samowystarczalność technologiczną i transformację wojskową. Program kieruje ogromne zasoby na budowę gospodarki i sił zbrojnych klasy światowej."
 md2026_chi_tech_self_reliance:0 "Samowystarczalność technologiczna"
 md2026_chi_tech_self_reliance_desc:0 "Chiny przyspieszyły działania na rzecz samowystarczalności technologicznej, zwłaszcza w dziedzinie półprzewodników, sztucznej inteligencji i zaawansowanej produkcji. Ogromne państwowe inwestycje w krajową produkcję chipów i badania mają przełamać zależność od zagranicznej technologii i zmniejszyć dystans do zachodnich konkurentów."

 ### IDEAS - Decision Reward Ideas ###
 md2026_sov_information_control:0 "Kontrola informacji"
 md2026_sov_information_control_desc:0 "Rząd rosyjski wdrożył wszechstronne środki kontroli informacji — cenzurę niezależnych mediów, blokowanie zagranicznych źródeł informacji i promowanie narracji państwowej. Opinia publiczna w kraju jest ściśle sterowana, co zwiększa stabilność reżimu kosztem swobód obywatelskich."
 md2026_sov_shadow_fleet:0 "Operacje floty cieni"
 md2026_sov_shadow_fleet_desc:0 "Rosja wykorzystuje flotę cieni złożoną z wiekowych tankowców, by obchodzić zachodnie limity cen ropy i sankcje. Statki te transportują rosyjską ropę naftową do chętnych nabywców przez niejasnych pośredników, utrzymując dochody z ropy mimo międzynarodowych ograniczeń."
 md2026_sov_partial_mobilization:0 "Częściowa mobilizacja"
 md2026_sov_partial_mobilization_desc:0 "Rosja ogłosiła częściową mobilizację, powołując rezerwistów i rozszerzając pobór, by wzmocnić siły na froncie. Choć zapewnia ona rozpaczliwie potrzebne zasoby ludzkie, wywołała powszechny niepokój społeczny i zakłócenia gospodarcze."
 md2026_chi_belt_road:0 "Inicjatywa Pasa i Szlaku"
 md2026_chi_belt_road_desc:0 "Chińska Inicjatywa Pasa i Szlaku wciąż się rozwija, finansując projekty infrastrukturalne w Azji, Afryce i Ameryce Łacińskiej. Program rozszerza chińskie wpływy gospodarcze i polityczne, tworząc jednocześnie zależności handlowe, które służą interesom strategicznym Pekinu."
 md2026_chi_taiwan_pressure:0 "Presja wojskowa na Tajwan"
 md2026_chi_taiwan_pressure_desc:0 "Chiny zintensyfikowały presję wojskową na Tajwan, zwiększając patrole morskie, naruszając tajwańską strefę ADIZ i przeprowadzając zakrojone na szeroką skalę ćwiczenia symulujące desant morski. Kampania ma zastraszyć Tajpej i zademonstrować determinację wobec Waszyngtonu."
 md2026_chi_tech_self_sufficiency:0 "Kampania samowystarczalności technologicznej"
 md2026_chi_tech_self_sufficiency_desc:0 "Chińska kampania samowystarczalności technologicznej kieruje miliardy na krajową produkcję półprzewodników, rozwój sztucznej inteligencji i badania nad komputerami kwantowymi. Celem jest wyeliminowanie zależności od zachodniej technologii i uzyskanie chińskiej dominacji w kluczowych sektorach technologicznych."
 md2026_raj_make_in_india_decision:0 "Make in India"
 md2026_raj_make_in_india_decision_desc:0 "Indyjska inicjatywa Make in India przyciągnęła zagranicznych producentów szukających alternatywy dla chińskich łańcuchów dostaw. Zachęty podatkowe, rozwój infrastruktury i ogromne zasoby siły roboczej przyciągają inwestycje w produkcję elektroniki, motoryzacji i sprzętu obronnego."
 md2026_raj_border_standoff:0 "Konfrontacja graniczna"
 md2026_raj_border_standoff_desc:0 "Siły indyjskie utrzymują podwyższoną gotowość wzdłuż spornego pogranicza z Chinami. Konfrontacja w regionie Himalajów doprowadziła do zwiększenia rozmieszczenia wojsk, rozbudowy infrastruktury i większego poboru, by bronić integralności terytorialnej."
 md2026_raj_space_program:0 "Program kosmiczny"
 md2026_raj_space_program_desc:0 "Indyjski program kosmiczny ISRO osiągnął niezwykłe kamienie milowe — udane misje księżycowe i słoneczne potwierdziły możliwości na światowym poziomie. Program podnosi prestiż państwa, napędza innowacje technologiczne i sytuuje Indie jako głównego gracza w nowym wyścigu kosmicznym."
 md2026_nko_nuclear_test_effect:0 "Sukces próby jądrowej"
 md2026_nko_nuclear_test_effect_desc:0 "Korea Północna przeprowadziła udaną próbę broni jądrowej, demonstrując ulepszone zdolności głowic. Choć test prowokuje międzynarodowe potępienie i zaostrzenie sankcji, znacząco wzmacnia strategiczne odstraszanie reżimu oraz propagandę wewnętrzną."
 md2026_nko_missile_provocation_effect:0 "Prowokacja rakietowa"
 md2026_nko_missile_provocation_effect_desc:0 "Korea Północna przeprowadziła prowokacyjną próbę rakietową, demonstrując światu swoje zdolności w zakresie rakiet balistycznych. Start służy zarówno jako sygnał wojskowy, jak i karta przetargowa w dążeniach reżimu do międzynarodowego uznania i złagodzenia sankcji."
 md2026_per_proxy_warfare:0 "Wojna przez pełnomocników"
 md2026_per_proxy_warfare_desc:0 "Iran nadal rzutuje siłę poprzez sieć swoich sił pełnomocniczych na Bliskim Wschodzie — Hezbollah w Libanie, milicje w Iraku i Hutich w Jemenie. Pełnomocnicy ci rozszerzają irańskie wpływy, ale też wyczerpują zasoby i prowokują konfrontację z regionalnymi rywalami."
 md2026_per_nuclear_program:0 "Program jądrowy"
 md2026_per_nuclear_program_desc:0 "Iran przyspieszył swój program jądrowy, wzbogacając uran do poziomu zbliżonego do uzbrojeniowego. Program zapewnia potencjalne odstraszanie strategiczne, ale wywołał surowe sankcje międzynarodowe i groźbę konfrontacji wojskowej z Izraelem i Stanami Zjednoczonymi."
 md2026_sau_vision_2030_acceleration:0 "Przyspieszenie Wizji 2030"
 md2026_sau_vision_2030_acceleration_desc:0 "Arabia Saudyjska przyspieszyła transformację gospodarczą w ramach Wizji 2030, kierując ogromne środki na megaprojekty, infrastrukturę turystyczną i dywersyfikację przemysłu. Ten błyskawiczny program modernizacji szybko buduje nowe fundamenty gospodarcze, wykraczające poza zależność od ropy naftowej."
 md2026_nuclear_modernization_effect:0 "Modernizacja jądrowa"
 md2026_nuclear_modernization_effect_desc:0 "Nasz arsenał jądrowy przechodzi wszechstronny program modernizacji — nowe systemy przenoszenia, ulepszone głowice oraz sprawniejsze dowodzenie i kontrolę. Program zapewnia, że nasz potencjał odstraszania jądrowego pozostanie wiarygodny i zdolny do przetrwania przez kolejne dziesięciolecia."
 md2026_sov_wartime_mobilization:0 "Mobilizacja wojenna"
 md2026_sov_wartime_mobilization_desc:0 "Rosyjska gospodarka została postawiona w stan mobilizacji wojennej. Produkcja wojskowa ma pierwszeństwo przed potrzebami cywilnymi, a moce przemysłowe przekierowano na wysiłek wojenny. Produkcja uzbrojenia znacznie rośnie, ale kosztem kapitału politycznego i stabilności społecznej."
 md2026_nuclear_posturing_effect:0 "Demonstracja siły jądrowej"
 md2026_nuclear_posturing_effect_desc:0 "Nasze państwo przyjęło agresywną postawę jądrową, sygnalizując gotowość użycia broni jądrowej, jeśli przetrwanie kraju byłoby zagrożone. Odstrasza to agresję konwencjonalną, ale podnosi napięcie międzynarodowe i budzi niepokój zarówno wśród sojuszników, jak i przeciwników."

 ### DECISIONS - Internal Politics ###
 md2026_sov_shadow_fleet_sales:0 "Sprzedaż ropy przez flotę cieni"
 md2026_sov_shadow_fleet_sales_desc:0 "Rozmieść rosyjską flotę cieni tankowców, by sprzedawać ropę naftową poza zachodnim limitem cen, obchodząc sankcje i ryzykując dalszą izolację międzynarodową."
 md2026_chi_belt_road_expansion:0 "Rozszerzenie Pasa i Szlaku"
 md2026_chi_belt_road_expansion_desc:0 "Rozszerz chińską Inicjatywę Pasa i Szlaku, finansując nowe projekty infrastrukturalne w krajach rozwijających się, by zwiększyć wpływy gospodarcze i polityczne."
 md2026_nko_nuclear_test:0 "Próba broni jądrowej"
 md2026_nko_nuclear_test_desc:0 "Przeprowadź próbę broni jądrowej, by zademonstrować zdolności w zakresie głowic i wzmocnić odstraszanie strategiczne, za cenę potępienia międzynarodowego."
 md2026_nko_missile_provocation:0 "Prowokacja rakietowa"
 md2026_nko_missile_provocation_desc:0 "Przeprowadź prowokacyjną próbę rakiety balistycznej, by zasygnalizować zdolności wojskowe i zmusić regionalnych przeciwników do negocjacji."
 md2026_nko_diplomatic_outreach:0 "Starania dyplomatyczne"
 md2026_nko_diplomatic_outreach_desc:0 "Podejmij starania dyplomatyczne wobec Korei Południowej, USA i Chin, dążąc do negocjacji w sprawie złagodzenia sankcji i gwarancji bezpieczeństwa."
 md2026_per_nuclear_acceleration:0 "Przyspieszenie programu jądrowego"
 md2026_per_nuclear_acceleration_desc:0 "Przyspiesz irański program jądrowy w kierunku uzyskania zdolności nuklearnych, godząc się na izolację międzynarodową w dążeniu do odstraszania strategicznego."
 md2026_sau_vision_acceleration:0 "Przyspiesz Wizję 2030"
 md2026_sau_vision_acceleration_desc:0 "Zaangażuj dodatkowe środki w transformację Arabii Saudyjskiej w ramach Wizji 2030, przyspieszając dywersyfikację gospodarczą i budowę megaprojektów."
 md2026_sau_normalize_israel:0 "Normalizacja stosunków z Izraelem"
 md2026_sau_normalize_israel_desc:0 "Dąż do historycznej normalizacji stosunków z Izraelem w ramach porozumień Abrahamowych. Może to przekształcić Bliski Wschód, ale spotka się ze sprzeciwem Iranu i krajowych środowisk konserwatywnych."

 ### DECISIONS - Nuclear ###
 md2026_nuclear_modernization:0 "Modernizacja arsenału jądrowego"
 md2026_nuclear_modernization_desc:0 "Rozpocznij wszechstronny program modernizacji broni jądrowej — unowocześnienie głowic, systemów przenoszenia i infrastruktury dowodzenia, by utrzymać odstraszanie strategiczne."
 md2026_nuclear_posturing:0 "Demonstracja siły jądrowej"
 md2026_nuclear_posturing_desc:0 "Przyjmij agresywną postawę jądrową, publicznie sygnalizując gotowość do użycia broni jądrowej. Może to odstraszyć agresora, ale zaniepokoi społeczność międzynarodową."
 md2026_develop_nuclear_weapons:0 "Opracuj broń jądrową"
 md2026_develop_nuclear_weapons_desc:0 "Rozpocznij tajny program rozwoju broni jądrowej. To długie i kosztowne przedsięwzięcie spotka się z ostrą reakcją międzynarodową, jeśli zostanie wykryte, ale zapewni najwyższy potencjał odstraszania strategicznego."

 ### VENEZUELA (US pressure campaign) ###
 md2026_venezuela.1.t:0 "Presja na Caracas"
 md2026_venezuela.1.d:0 "Amerykańskie grupy lotniskowcowe operują u wybrzeży Wenezueli, a ataki na podejrzane jednostki przemytnicze stały się rutyną. Biały Dom musi zdecydować, czy utrzymać presję na rząd Maduro, czy wycofać się, zanim konfrontacja przerodzi się w pełną wojnę."
 md2026_venezuela.1.a:0 "Utrzymaj presję."
 md2026_venezuela.1.b:0 "Zdeeskaluj i zaoferuj drogę wyjścia."

 ### FOCUS TREES - BOOKMARK COUNTRIES (2026) ###
 MD2026_FIN_arctic_shield:0 "Arktyczna tarcza"
 MD2026_FIN_arctic_shield_desc:0 "Finlandia wstąpiła do NATO i zamknęła wschodnią granicę. Licząca 1340 km granica z Rosją jest teraz północną strażnicą sojuszu, a Helsinki inwestują w obronę Laponii, Morza Bałtyckiego i własny przemysł zbrojeniowy."
 MD2026_FIN_nato_integration:0 "Integracja z NATO"
 MD2026_FIN_nato_integration_desc:0 "Pogłęb integrację Finlandii z północnym dowództwem NATO: wspólne ćwiczenia, bazy sojusznicze i wymiana wywiadowcza przy granicy z Rosją."
 MD2026_FIN_defense_budget:0 "Wzrost budżetu obronnego"
 MD2026_FIN_defense_budget_desc:0 "Zwiększ wydatki na obronę do około 3% PKB, rozbudowując rezerwy wojenne, flotę F-35 i zapasy artylerii armii."
 MD2026_FIN_arctic_logistics:0 "Logistyka arktyczna"
 MD2026_FIN_arctic_logistics_desc:0 "Rozbuduj północną sieć kolejową i drogową wraz z Norwegią i Szwecją, łącząc wolne od lodu porty północy z rynkiem europejskim."

 MD2026_SWE_total_defense:0 "Obrona totalna"
 MD2026_SWE_total_defense_desc:0 "Szwecja zakończyła dwa stulecia neutralności i wstąpiła do NATO. Model obrony totalnej koordynuje teraz siły zbrojne, obronę cywilną i przemysł wobec rosyjskiej presji na Bałtyku."
 MD2026_SWE_northern_flank:0 "Północna flanka"
 MD2026_SWE_northern_flank_desc:0 "Zamień Szwecję w bazę wypadową dla sił sojuszniczych w Skandynawii, z stałymi ćwiczeniami na północy i wzmocnionym garnizonem na Gotlandii."
 MD2026_SWE_gripen_program:0 "Program Gripen"
 MD2026_SWE_gripen_program_desc:0 "Przyspiesz dostawy Gripena E i kampanie eksportowe Saaba, utrzymując szwedzki przemysł lotniczy na technologicznym szczycie."
 MD2026_SWE_baltic_security:0 "Bezpieczeństwo Morza Bałtyckiego"
 MD2026_SWE_baltic_security_desc:0 "Chroń bałtyckie szlaki żeglugowe, kable podmorskie i infrastrukturę energetyczną przed sabotażem i operacjami floty cieni."

 MD2026_NRY_northern_flank:0 "Północna flanka"
 MD2026_NRY_northern_flank_desc:0 "Norwegia strzeże arktycznej flanki NATO, od luki GIUK po Svalbard. Plan obronny na 2026 rok finansuje nowe fregaty, obronę przeciwlotniczą i stałą obecność sojuszników na północy."
 MD2026_NRY_arctic_defense:0 "Obrona Arktyki"
 MD2026_NRY_arctic_defense_desc:0 "Rozbuduj marynarkę wojenną i obronę wybrzeża, aby w kryzysie utrzymać otwarte szlaki morskie od Atlantyku po Morze Barentsa."
 MD2026_NRY_energy_security:0 "Bezpieczeństwo energetyczne"
 MD2026_NRY_energy_security_desc:0 "Jako główny dostawca gazu dla Europy Norwegia inwestuje w bezpieczeństwo rurociągów, ochronę infrastruktury morskiej i długoterminowe kontrakty z sojusznikami."
 MD2026_NRY_nato_basing:0 "Bazy NATO"
 MD2026_NRY_nato_basing_desc:0 "Przyjmij sojusznicze zgrupowania szkoleniowe w północnej Norwegii i zintegruj obronę przeciwlotniczą z dowództwem północnym NATO."

 MD2026_ROM_black_sea_bastion:0 "Bastion Morza Czarnego"
 MD2026_ROM_black_sea_bastion_desc:0 "Rumunia leży na styku wschodniej i południowej flanki NATO. Z wojną w Ukrainie na granicy Bukareszt gości siły sojusznicze i obserwuje Morze Czarne."
 MD2026_ROM_allied_presence:0 "Obecność sojusznicza"
 MD2026_ROM_allied_presence_desc:0 "Rozbuduj obecność wojsk sojuszniczych w Mihail Kogalniceanu i na wybrzeżu Morza Czarnego, zakotwiczając wschodnią obronę NATO."
 MD2026_ROM_air_defense:0 "Tarcza obrony przeciwlotniczej"
 MD2026_ROM_air_defense_desc:0 "Zbuduj zintegrowaną tarczę przeciwlotniczą z bateriami Patriot, operacjami F-16 i krajowym przemysłem dronów."
 MD2026_ROM_moldova_support:0 "Wsparcie dla Mołdawii"
 MD2026_ROM_moldova_support_desc:0 "Wesprzyj Kiszyniów przeciw rosyjskiej presji dostawami energii, inwestycjami infrastrukturalnymi i wsparciem dyplomatycznym dla jego drogi do UE."

 MD2026_BRM_juntas_war:0 "Wojna junty"
 MD2026_BRM_juntas_war_desc:0 "Pięć lat po zamachu stanu birmańska junta traci terytorium na rzecz ruchu oporu i armii etnicznych. Generałowie muszą zdecydować, jak utrzymać państwo."
 MD2026_BRM_great_power_support:0 "Wsparcie mocarstw"
 MD2026_BRM_great_power_support_desc:0 "Kupuj drony, samoloty i amunicję od Rosji i Chin, aby utrzymać armię w polu mimo zachodnich sankcji."
 MD2026_BRM_hold_the_heartland:0 "Utrzymaj centrum kraju"
 MD2026_BRM_hold_the_heartland_desc:0 "Skup się na irrawaddyjskim centrum, broniąc miast oraz infrastruktury gazowej i energetycznej, która utrzymuje reżim przy życiu."
 MD2026_BRM_dry_season_offensive:0 "Ofensywa w porze suchej"
 MD2026_BRM_dry_season_offensive_desc:0 "Rozpocznij wielką ofensywę w porze suchej przeciw ruchowi oporu, akceptując ciężkie straty i międzynarodowe potępienie."

 MD2026_HUN_sovereignty:0 "Suwerenność przede wszystkim"
 MD2026_HUN_sovereignty_desc:0 "Rząd Węgier gra na dwóch frontach: w NATO i UE, ale z bliższymi więzami z Moskwą i Pekinem, niż akceptują sojusznicy. Budapeszt obstaje przy własnej drodze."
 MD2026_HUN_eastern_opening:0 "Otwarcie na Wschód"
 MD2026_HUN_eastern_opening_desc:0 "Pogłęb współpracę gospodarczą z Chinami i Rosją - fabryki baterii, rozbudowa Paksu i kontrakty energetyczne - mimo zachodniej krytyki."
 MD2026_HUN_paks_expansion:0 "Rozbudowa Paksu"
 MD2026_HUN_paks_expansion_desc:0 "Rozbuduj elektrownię jądrową Paks, aby zapewnić tanią energię elektryczną i zmniejszyć zależność od importowanego gazu."
 MD2026_HUN_visegrad_cooperation:0 "Współpraca wyszehradzka"
 MD2026_HUN_visegrad_cooperation_desc:0 "Odbuduj Grupę Wyszehradzką jako platformę regionalną, koordynując z Polską, Czechami i Słowacją politykę migracyjną, energetyczną i reformę UE."

 MD2026_SUD_generals_war:0 "Wojna generałów"
 MD2026_SUD_generals_war_desc:0 "Sudan rozdziera wojna między armią a Siłami Szybkiego Wsparcia - najgorszy kryzys humanitarny świata, którego stawką jest dolina Nilu."
 MD2026_SUD_arms_imports:0 "Import uzbrojenia"
 MD2026_SUD_arms_imports_desc:0 "Kupuj drony, artylerię i amunicję od państw Zatoki i Turcji, aby utrzymać machinę wojenną w ruchu."
 MD2026_SUD_nile_politics:0 "Polityka Nilu"
 MD2026_SUD_nile_politics_desc:0 "Wykorzystaj położenie Sudanu nad Nilem do nacisku na Egipt i Etiopię w sprawie Wielkiej Tamy Renesansu i praw do wód rzeki."
 MD2026_SUD_humanitarian_crisis:0 "Kryzys humanitarny"
 MD2026_SUD_humanitarian_crisis_desc:0 "Otwórz korytarze pomocowe i opanuj napływ uchodźców - przynajmniej na tyle, by państwo i gospodarka nie upadły całkowicie."
